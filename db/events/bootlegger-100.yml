    aid: "Fully stocked with fluids and food; normal aid station snacks and drinks with hot food in the evening. Cupless — runners use the reusable cup from their drop bag."
    bathroom: null
    park: "Parking around the Group Shelter and picnic areas, first come first served; a state-park parking pass is required for non-members; no parking at the Idlewilde Event Center or the boat-ramp gravel lot."
    crew_notes: "Crew members may set up tents, chairs, and supplies at the Start/Finish area around the Group Shelter and picnic areas; runners see their crew every loop."
    pacer_notes: "No pacer from the start: pacers may begin only after 5:00 PM Saturday, joining at the Start/Finish aid station."
    road: null
    source_metadata: &official_station_source
