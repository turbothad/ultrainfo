# Bootlegger 100 — event data (imported by Events::Import via db/seeds.rb).
# The 2027 UltraSignup listing and bootlegger100.com carry the race facts;
# the Runners Packet Google Doc carries the schedule, crew table, pacer
# rules, and drop-bag policy; the listing's Download GPX File link is the
# geometry and elevation authority. Source decisions are documented in
# docs/research/bootlegger-2027-source-audit.md.

race:
  name: Bootlegger 100
  slug: bootlegger-100
  year: 2027
  state: GA
  distance_mi: 100 # Eight 12.5-mile loops; the official GPX GPS-measures the loop at 12.31.
  elevation_gain_ft: null # Organizer figures conflict: the listing says roughly 9,000 total, the site about 1,050 per loop, and the Runners Packet approximately 1,000 per loop.
  elevation_loss_ft: null
  start_date: 2027-03-20
  end_date: 2027-03-21
  start_time: 6:00 AM
  time_zone: America/New_York
  cutoff_hours: 35 # "The cutoff for the 100 mile race is 5pm on Sunday-35 hours" from the 6:00 AM Saturday start.
  official_url: https://www.bootlegger100.com/
  registration_url: https://ultrasignup.com/register.aspx?did=137845
  results_url: https://ultrasignup.com/register.aspx?did=137845 # The listing page carries the 2023-2026 results tabs.
  registration_status: open # The 2027 listing sells all three distances ($250 for the 100, rising after November 26; closes March 10, 2027).
  lottery: false # Direct registration, but every runner must have finished a 50K (or 50 miles on this course) before signing up.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "Eight 12.5-mile loops from the Group Shelter at Indian Springs State Park through the Dauset Trails mountain-bike network near Flovilla, GA, with a half mile of road, the 3.5-mile Indian Springs connector, and about two miles of gravel and paved road closing each loop. The organizer's gain figures conflict — the 2027 listing says roughly 9,000 feet total (a little over 1K each loop), bootlegger100.com says about 1,050 feet per loop, and the Runners Packet says approximately 1,000 per loop — so no figure is recorded. The official GPX GPS-measures the loop at 12.31 miles with an 18-foot closure against the billed 12.5, which governs pass miles. Two published cutoffs: the last loop must start by 12:00 PM Sunday (mile 87.5) and everything ends 5:00 PM Sunday (35 hours). run100s' 32-hour cutoff and 6,000-foot climb have no counterpart on the current sources."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_ultrasignup
        label: "UltraSignup 2027 registration page (dates, starts, prices, GPX link)"
        url: "https://ultrasignup.com/register.aspx?did=137845"
        verified_on: "2026-08-13"
      - &source_site
        label: "bootlegger100.com (course info, cutoff schedule, pacer and crew rules)"
        url: "https://www.bootlegger100.com/"
        verified_on: "2026-08-13"
      - &source_packet
        label: "Runners Packet (schedule, crew table, drop bags, cupless rule)"
        url: "https://docs.google.com/document/d/1H8htzM3H2QVdtlCPtS5YxA7A4CabbLmh_pdEovRyONc/edit"
        verified_on: "2026-08-13"
      - &source_gpx
        label: "Official course GPX download (Bootlegger Route, linked from the listing)"
        url: "https://drive.google.com/uc?export=download&id=1KFRF0BiRw6BoGRH3SfZzJo660pKX9E3l"
        verified_on: "2026-08-13"
      - &source_visorando
        label: "Course map on visorando (linked from the listing)"
        url: "https://www.visorando.com/en/walk-90684483/"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. A Western States qualifier for 2027: every 2027 finisher who registered by October 1, 2026 enters a raffle for a 2028 WSER entry, drawn at the race. Qualification to enter: a finished 50K (or 50 miles on this course). This is a cupless race — every runner gets a reusable cup in their drop bag, and pacers bring their own. The race starts and finishes at the Group Shelter beside the lake at Indian Springs State Park; crews set up tents, chairs, and supplies around the shelter and picnic areas from 2:00 PM Friday, parking passes are required for non-members, and crewing is banned along the gravel Lake Clark Road section. Packet pickup 3:00-6:00 PM Friday with a 5:00 PM pasta dinner, then race-morning pickup from 5:00 AM. Refunds or deferrals run 100% until three months out, none after."
    overall_cutoff_label: "5:00 PM March 21, 2027"
    overall_cutoff_notes: "35 hours from the 6:00 AM Saturday start — the cutoff schedule says 5:00 PM on Sunday, with the last loop starting by 12:00 PM Sunday (five hours for the final loop). All races end by 5:00 PM Sunday."
    pacer_rule_summary: "Pacers may start pacing after 5:00 PM Saturday, joining at the Start/Finish aid station only; one pacer per runner at a time; pacer bibs come from packet pickup and every pacer registers and signs the waiver. Pacers may eat and drink from the aid stations but bring their own cup. No pacers in the 12.5-mile or 50-mile races."
    drop_bag_summary: "Drop bags are taken for the mile-6.2 aid station only, left at packet pickup Friday or Saturday (reasonable size, no coolers), returned after the race Sunday. The start/finish needs no bags — crews and runner supplies set up at the Group Shelter each loop."
    tracking_note: "No live tracking is published; results post on UltraSignup."
  blurb: Eight fast 12.5-mile loops from Indian Springs State Park through the Dauset Trails near Flovilla, Georgia.
  about: >-
    The Bootlegger 100 runs eight 12.5-mile loops from the Group Shelter
    at Indian Springs State Park through the Dauset Trails
    mountain-bike network near Flovilla, GA — gently rolling single
    track built for first-timers and PR seekers, with a Western States
    qualifying berth on the line. Start 6:00 AM Saturday with a 35-hour
    cutoff (5:00 PM Sunday) and one hard gate: the last loop must start
    by noon. Two stations serve each loop, crews camp at the
    start/finish shelter, drop bags cover the mile-6.2 station, and
    pacers join from 5:00 PM Saturday.
  start_venue: Group Shelter, Indian Springs State Park, Flovilla, GA
  finish_venue: Group Shelter, Indian Springs State Park, Flovilla, GA

