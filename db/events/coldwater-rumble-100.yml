# Station passes: coordinates from the GPX waypoints (`match` = waypoint-name
# substring; waypoints are the organizer's CalTopo markers). Miles use the
# 2026 Runner Guide cutoff-table frame; Gila and the mid-red HQ pass are
# map-measured. Later loops merge (`<<:`) the first passes and override what
# changes.
aid_stations:
  - match: "Rumble HQ Aid"
    name: "Start — Rumble HQ"
    direction: "Start"
    mile: 0.0
    elev: 1035
    crew: true
    water: true
    pacer: false
    drop: null
    food: true
    med: true
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "Full aid at the start/finish with the published hot-food menu (grilled cheese, quesadillas, pasta, potato soup, pancakes, breakfast burritos, hot dogs through the weekend). The HQ site layout includes a medical tent, warming tent, and timing."
    bathroom: "Restrooms are marked at the Rumble HQ site layout."
    park: "Rumble HQ parking is reserved for runners; crews and spectators use the satellite lots across the road. Enter from Indian Springs Road onto Old Baseline Road — do not navigate to the main park entrance."
    crew_notes: "Crews are welcome at Rumble HQ for the full 32 hours; canopies and pop-ups line the interior of the HQ loop, and runners pass through every lap. The final ~0.2-mile HQ loop is a neutral zone where crew, family, and dogs may run in with their runner."
    pacer_notes: "Pacing begins after mile 47.1 — not at the start."
    road: null
    source_metadata: &official_station_source
      verification_status: warning
