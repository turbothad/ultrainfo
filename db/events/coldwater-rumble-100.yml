# Coldwater Rumble 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry copies the organizer's CalTopo "100 Mile" line; station
# coordinates are the organizer's CalTopo markers. Station-pass miles use the
# 2026 Runner Guide's cutoff-table frame (red loops clear at 20.1, blue loops
# at 47.1/74.1/101.2, Rainbow Valley +8.6, Pedersen +11.0, Horse Thief +19.2
# per blue loop); the CalTopo line measures 101.0 miles against the guide's
# 101.2. Source decisions are documented in
# docs/research/coldwater-rumble-2027-source-audit.md.

race:
  name: Coldwater Rumble 100
  slug: coldwater-rumble-100
  year: 2027
  state: AZ
  distance_mi: 100
  elevation_gain_ft: 8687 # Official race page: total gain for the 100 Mile.
  elevation_loss_ft: null # The loop course returns to Rumble HQ; the organizer publishes gain only.
  start_date: 2027-01-16
  end_date: 2027-01-17
  start_time: 7:00 AM
  time_zone: America/Phoenix
  cutoff_hours: 32 # 7:00 AM Saturday start → 3:00 PM Sunday final cutoff.
  official_url: https://aravaiparunning.com/coldwater/
  registration_url: https://ultrasignup.com/register.aspx?did=138367
  results_url: https://ultrasignup.com/results_event.aspx?did=138367
  registration_status: open # Registration open at verification; closes 2027-01-11 11:59 PM MT.
  lottery: false # Direct first-come UltraSignup registration; no lottery in any reviewed source.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "The 100 Mile runs two Red Loops then three Blue Loops (Red, Red, Blue, Blue, Blue). Against the billed 100, the 2027 page's key stats say 101.3 miles, the 2026 Runner Guide's cutoff table 101.2, and the organizer's CalTopo line measures 101.0. Pass miles use the guide's cutoff-table frame; Gila Aid and the mid-red HQ pass carry map-measured miles because the guide publishes no red-loop station miles. The guide spells the second blue-loop station Pedersen in its cutoff table and Pederson on its maps. Detailed cutoffs, menu, and site layout are from the 2026-edition guide and may change for 2027; the 2027 race page already states the same cutoff pattern. Spot elevations are USGS 3DEP queries at the organizer's station markers."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_race_page
        label: "Coldwater Rumble official race page (Aravaipa Running)"
        url: "https://aravaiparunning.com/coldwater/"
        verified_on: "2026-08-13"
      - &source_runner_guide
        label: "Coldwater Rumble Runner Guide (2026 edition)"
        url: "https://www.aravaiparunning.com/avr/wp-content/uploads/CWR26-Runner-Guide.pdf"
        verified_on: "2026-08-13"
      - &source_caltopo
        label: "Organizer CalTopo course map (100 Mile line and station markers)"
        url: "https://caltopo.com/m/UUDUK23"
        verified_on: "2026-08-13"
      - &source_ultrasignup
        label: "2027 UltraSignup listing"
        url: "https://ultrasignup.com/register.aspx?did=138367"
        verified_on: "2026-08-13"
      - &source_live
        label: "Aravaipa live tracking"
        url: "https://live.aravaiparunning.com/#/"
        verified_on: "2026-08-13"
      - &source_usgs
        label: "USGS 3DEP Elevation Point Query Service (spot elevations)"
        url: "https://epqs.nationalmap.gov/v1/json"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Every station serves food from the published menu but no source certifies water potability. The Rumble HQ site layout marks a medical tent; no medical service is published for the backcountry stations. Rainbow Valley and Pedersen cutoffs are published as soft cutoffs that may be enforced at the race director's discretion. Aravaipa posts live tracking for each runner during the race."
    overall_cutoff_label: "3:00 PM January 17, 2027"
    overall_cutoff_notes: "32 hours from the 7:00 AM Saturday start, an 18:59 min/mile elapsed pace for the guide's 101.2-mile course. Hard intermediate cutoffs: clear the second Red Loop by 1:30 PM Saturday (mile 20.1), begin the final Blue Loop by 6:30 AM Sunday (74.1), leave Horse Thief by 12:30 PM Sunday (93.3). Soft cutoffs at Rainbow Valley (9:15 AM, 82.7) and Pedersen (10:00 AM, 85.1) may be enforced at the race director's discretion."
    pacer_rule_summary: "Pacers may join 100 Mile runners after mile 47.1 for the last two Blue Loops, entering and exiting the course only at Rumble HQ or Horse Thief Aid. One pacer per runner at any given time, human and on foot, no muling. Pacers need no bib and are welcome to aid-station offerings."
    drop_bag_summary: "Drop bags are dropped at Rumble HQ on Friday during packet pickup or on race morning, with designated spots for bags going to Horse Thief and bags staying at the start/finish."
  blurb: Two red loops and three blue loops of Sonoran desert single track at Estrella Mountain Regional Park.
  about: >-
    The Coldwater Rumble 100 runs two 10-mile Red Loops and three 27-mile Blue
    Loops from Rumble HQ at Estrella Mountain Regional Park's Competitive
    Track in Goodyear, AZ — crushed-granite single track, rocky ridges, sandy
    washes, and old jeep roads with 8,687 ft of gain. Start 7:00 AM Saturday;
    32-hour limit (3:00 PM Sunday) with hard cutoffs at miles 20.1, 74.1, and
    93.3. Crews work Rumble HQ every lap and Horse Thief on the blue loops.
  start_venue: Rumble HQ, Competitive Track, Estrella Mountain Regional Park, Goodyear, AZ
  finish_venue: Rumble HQ, Competitive Track, Estrella Mountain Regional Park, Goodyear, AZ

