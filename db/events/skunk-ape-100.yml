        label: "UltraSignup 2027 listing (the race's primary public page: dates, start, fees, course, cutoffs, crew, pacers, drop bags)"
        url: "https://ultrasignup.com/register.aspx?did=142072"
        verified_on: "2026-08-14"
      - &source_caltopo
        label: "Organizer CalTopo course map (lines and station markers)"
        url: "https://caltopo.com/m/GHHF0"
        verified_on: "2026-08-14"
      - &source_us_2026
        label: "UltraSignup 2026 listing (April 25, 2026; results)"
        url: "https://ultrasignup.com/register.aspx?did=129761"
        verified_on: "2026-08-14"
      - &source_epqs
        label: "USGS 3DEP point elevation service (series and station spots; the CalTopo lines carry no elevations)"
        url: "https://epqs.nationalmap.gov/v1/json"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. The Skunk Ape 100 Mile Endurance Run by Skunk Ape Events. Pre-race packet pickup and the Central Florida Trail Fest run Friday April 23, 4-9 PM at the Santos Trailhead; camping is available at the 25-site Santos Campground by the start. Aid stations, staffed or unstaffed, stock soda, pickles, pickle pops, gummy worms, mustard packets, gels, chips, cookies, salt tabs, produce, and powdered electrolytes, with some type of hot food or coffee and glow lights for the night miles; band-aid and hygiene boxes sit at every station but no station-level medical staffing is published. Out-bound is marked with pink ribbons in trees, in-bound with pink flags at ground level, both with reflectors. Finishers earn the belt buckle; the top four men and women take wooden trophies. The 2027 Guidebook and Rules are 'Coming Soon' on the listing."
    overall_cutoff_label: "7:00 PM April 25, 2027"
    overall_cutoff_notes: "36 hours from the Saturday 7:00 AM start. The ladder: Santos halfway (51.76) by 2:00 AM, Pruitt Trailhead (80.02) by 10:52 AM, St. Rt. 200 (86.52) by 1:07 PM, 49th Ave (92.52) by 3:13 PM, Land Bridge (96.42) by 4:33 PM (printed 4:33:32 PM), finish by 7:00 PM. The listing prints every cutoff as 'April 26th Sunday', but the race Sunday is April 25, 2027; the clocks are internally consistent with the 36-hour frame."
    pacer_rule_summary: "100-milers may pick up a pacer after 50 miles — from the Santos halfway (51.76) onward. Pacers may, and are encouraged to, help the runner navigate. Runners over the age of 60, or others needing special assistance, may have a pacer at any time. Pacers are not allowed drop bags."
    drop_bag_summary: "Collected at the start. Two locations for everyone — the 49th Avenue and Pruitt Trailhead stations — plus a third for 100-milers at Ross Prairie. Mark bags with the station name and your name in duck tape; keep them no larger than a standard drawstring bag. Bags return to the start/finish only after their station packs up, though every station is drivable for early pickup."
    tracking_note: "No live tracking is published; results post on UltraSignup."
  blurb: A flat Florida Trail and Cross Florida Greenway double loop from the Santos Trailhead in Ocala with 36 hours on the clock.
  about: >-
    The Skunk Ape 100 runs the Marjorie Harris Carr Cross Florida
    Greenway twice from the Santos Trailhead in Ocala — out on the
    Florida National Scenic Trail through sand pine scrub and the Ross
    Prairie Wildlife Management Area to the Pruitt Trailhead
    turnaround, back on the Florida Trail and the paved Greenway path.
    Single track, sand, roots, and short climbs past the highest most
    southern switchback in the United States, with about 3,100 feet of
    gain across 103.5 miles, crew access at every station, pacers from
    the halfway, and 36 hours to the buckle.
  start_venue: Santos Trailhead, 3080 S.E. 80th St, Ocala, FL
  finish_venue: Santos Trailhead, 3080 S.E. 80th St, Ocala, FL

