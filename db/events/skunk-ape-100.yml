# Skunk Ape 100 — event data (imported by Events::Import via db/seeds.rb).
# The UltraSignup 2027 listing is the race's primary public page (dates,
# start, fees, course, segment distances, cutoff ladder, crew, pacer, and
# drop-bag rules); the organizer CalTopo map it links is the geometry
# authority; USGS 3DEP point elevations supply the profile because the
# CalTopo lines are two-dimensional. Source decisions are documented in
# docs/research/skunk-ape-2027-source-audit.md.

race:
  name: Skunk Ape 100
  slug: skunk-ape-100
  year: 2027
  state: FL
  distance_mi: 103.5 # The cutoff table's cumulative frame: the Santos halfway prints 51.76 (doubled 103.52; the listing's 36-hour pace math implies ~103.4); the segment list sums to 52.39 per loop and the CalTopo loop GPS-measures 51.61.
  elevation_gain_ft: 3124 # "Elevation Gain: 1,562' (Double that for the 100 Mile)" — outbound +871'/-865', in-bound +691'/-701' per loop.
  elevation_loss_ft: 3132
  start_date: 2027-04-24
  end_date: 2027-04-25
  start_time: 7:00 AM
  time_zone: America/New_York
  cutoff_hours: 36 # "Cut-Off: 36 Hours" — the finish closes 7:00 PM Sunday.
  official_url: https://ultrasignup.com/register.aspx?did=142072
  registration_url: https://ultrasignup.com/register.aspx?did=142072
  results_url: https://ultrasignup.com/register.aspx?did=129761 # The 2026 listing carries the results.
  registration_status: open # The 2027 listing sells the 100 ($262 plus fees; closes April 20, 2027 at 11:59 PM ET).
  lottery: false # Direct UltraSignup registration.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "A flat double loop on the Florida National Scenic Trail and the paved trails of the Marjorie Harris Carr Cross Florida Greenway from the Santos Trailhead in Ocala, FL: out through the Ross Prairie Wildlife Management Area to the Pruitt Trailhead turnaround, back on the Florida Trail bypassing Ross Prairie, done twice. The 2027 UltraSignup listing is fully 2027-frame (April 24-25, 2027; 7:00 AM; 36 hours; open registration closing April 20, 2027) and is the race's primary public page — the listed \"Event Website\" link is a login-walled Facebook page. The organizer's own mileage surfaces conflict at the plus-or-minus-one-mile level: the per-segment list sums the loop to 52.39, the cutoff table prints the Santos halfway at 51.76, and the organizer CalTopo loop GPS-measures 51.61; the cutoff table's cumulative frame governs (halfway 51.76, total 103.5), and the loop-two cumulative cutoffs (80.02, 86.52, 92.52, 96.42) govern those passes against the segment chain's 81.05 arithmetic, with pass-specific notes. All cutoff clocks print 'April 26th Sunday', but the race Sunday is April 25, 2027 — the weekday-plus-clock frame is internally consistent with 36 hours from the Saturday 7:00 AM start. run100s' 2,790-foot climb has no counterpart (the listing says 1,562 feet per loop, doubled to 3,124)."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
        verified_on: "2026-08-14"
      sources:
