# San Diego 100 — event data (imported by Events::Import via db/seeds.rb).
# The 2027-frame sandiego100.com pages carry the race facts; the course
# page's "final table of aid stations (with cut-offs) for the 2027 event"
# carries the pass table (with one impossible cutoff clock corrected by
# the chart's own ladder and the Racebook's print); the official course
# GPX is the geometry and elevation authority. Source decisions are
# documented in docs/research/san-diego-2027-source-audit.md.

race:
  name: San Diego 100
  slug: san-diego-100
  year: 2027
  state: CA
  distance_mi: 100.6 # The aid chart's cumulative frame; the official GPX GPS-measures 100.12 and the Garmin course shows 100.04.
  elevation_gain_ft: 13000 # The 2027 Event Info page: "just over 13,000 feet of climbing/descent each"; the 2026 Racebook says ~15,000 each (its FAQ: runners report 13,000-15,500) and the Garmin course shows 12,607/12,604.
  elevation_loss_ft: 13000
  start_date: 2027-04-30
  end_date: 2027-05-01
  start_time: 6:00 AM
  time_zone: America/Los_Angeles
  cutoff_hours: 32 # "There is a 32-hour time limit with intermediate aid station cut-off times" — the finish closes 2:00 PM Saturday.
  official_url: https://sandiego100.com/
  registration_url: https://ultrasignup.com/register.aspx?did=139173
  results_url: https://ultrasignup.com/register.aspx?did=116822 # The home page's 2026 runners/results pointer.
  registration_status: not_open # "Registration Opens Fri. Jan 1, 2027 @ 12:00 AM PT" (UltraSignup) and the site's January 1 paragraphs; the home banner's "Registration is OPEN!" is contradicted by every other surface.
  lottery: false # First-come, first-served to a 300-runner cap with a waitlist; a qualification standard applies but no drawing.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "The 25th annual San Diego 100 Mile Endurance Run from Lake Cuyamaca (15027 Highway 79, Julian, CA): Friday, April 30, 2027 at 6:00 AM to Saturday, May 1 at 2:00 PM, 32 hours, in the Mt Laguna Recreational Area and along the Pacific Crest, Noble Canyon, and Lake Cuyamaca trails. The course page presents the final 2027 aid table; its Hammer's Hideaway cell prints 10:15 AM, an impossible clock at mile 51.8 (it would postdate the next cutoff), and the chart's own ladder plus the 2026 Racebook's print give 10:15 PM Friday, which governs with a pass-specific note. The home banner says 2027 registration is open, but the Event Info, Registration, and UltraSignup surfaces all say it opens January 1, 2027 — not_open governs. The Event Info page's climb figure (just over 13,000 feet each) governs against the Racebook's ~15,000 and the Garmin course's 12,607/12,604. Registration requires a qualifier (a sub-13-hour 50-mile or a 100k/100-mile finish between January 1, 2025 and April 1, 2027) plus six volunteer hours or a $105 TrailFit donation. run100s' 13,165/13,180 climb figures have no first-party counterpart."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
        verified_on: "2026-08-14"
      sources:
        verified_on: "2026-08-14"
    sources:
      - &source_home
        label: "sandiego100.com home (2027 frame, registration opening, qualifier, volunteer requirement)"
        url: "https://sandiego100.com/"
        verified_on: "2026-08-14"
      - &source_event_info
        label: "Event Info page (dates, 32 hours, station and drop-bag counts, climb figure, Solo Division)"
        url: "https://sandiego100.com/sample-page/"
        verified_on: "2026-08-14"
      - &source_course_page
        label: "2027 Course page (the final 2027 aid table, maps, GPX, turn-by-turn links)"
        url: "https://sandiego100.com/course/"
        verified_on: "2026-08-14"
      - &source_chart
        label: "2027 aid station chart (miles, GPS, open and cutoff clocks, drop/crew/pacer columns)"
        url: "https://www.predsci.com/~pete/sd100/2025-sd-100-miles-chart.png"
        verified_on: "2026-08-14"
      - &source_gpx
        label: "Official course GPX (route with elevations, converted to a track in the bundle)"
        url: "https://www.predsci.com/~pete/sd100/san-diego-100-mile-endurance-run.gpx"
        verified_on: "2026-08-14"
      - &source_racebook
        label: "2026 Racebook PDF (drop-bag, pacer, crew, and cutoff rules; served by the 2027 Racebook page)"
        url: "https://www.predsci.com/~pete/sd100/SD100-Participant-Guide-2026.pdf"
        verified_on: "2026-08-14"
      - &source_us_2027
        label: "UltraSignup 2027 listing (April 30, 2027; 6:00 AM; opens January 1, 2027)"
        url: "https://ultrasignup.com/register.aspx?did=139173"
        verified_on: "2026-08-14"
      - &source_us_2026
        label: "UltraSignup 2026 listing (results)"
        url: "https://ultrasignup.com/register.aspx?did=116822"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. A 2027 Western States qualifying race for finishers under 32 hours. Cupless. The Solo Division runs without crew or pacers, relying on stations and drop bags, and earns the SOLO buckle; supported runners are limited to one crew vehicle with an SD 100 parking pass (distributed at the 6:10 AM crew briefing). Runners over 60 may start an hour early at 5:00 AM but must be ready to self-support to Cuyamaca Peak. Aid stations carry water, Tailwind, gels, Coke, Mountain Dew, ginger ale, ice, electrolyte pills, fruit, salty food, cookies, PB&J, and candies, with hot soup and drinks at night and at least one vegan option; no pain relievers anywhere. The two water-only rows (Blue Ribbon, Pine Creek Road — the Racebook calls the latter Big Oak) are unmanned, and runners cannot withdraw from the race there. Cutoffs are leave-by and strictly enforced, with extension considered only if 25 percent or more of the field misses one; buckles for sub-24, sub-32, and Solo finishers, and every finisher takes the embroidered hoodie. The 2027 Racebook was not yet posted at verification; the 2026 Racebook's rules are recorded here."
    overall_cutoff_label: "2:00 PM May 1, 2027"
    overall_cutoff_notes: "32 hours from the Friday 6:00 AM start; runners must leave each station at or before its cutoff. The ladder: Trout Pond 10:00 AM, Cuyamaca Peak 12:45 PM, Green Valley 3:30 PM, Sweetwater 7:00 PM Friday; Hammer's Hideaway 10:15 PM Friday (the 2027 chart prints 10:15 AM, an impossible clock; the Racebook prints 10:15 PM); Penny Pines 1 1:00 AM, Meadows 2:45 AM, Red Tail Roost 4:45 AM, Per's Cabin 6:15 AM, Penny Pines 2 7:45 AM, Pioneer Mail 9:00 AM, Sunrise 11:15 AM, finish 2:00 PM Saturday."
    pacer_rule_summary: "Supported runners may have one pacer at a time beginning at Sweetwater (41.4), switching only at Meadows, Red Tail Roost, Pioneer Mail, and Sunrise. Pacers check in and out of stations with their runner, may use station aid, and may not mule or physically assist. Solo Division runners take no pacers. Friends and family may run in from the lakeside picnic tables (about a half mile out) to the finish."
    drop_bag_summary: "Eight designated drop-bag stations — Cuyamaca Peak, Sweetwater, Hammer's Hideaway, Penny Pines 1 and 2, Red Tail Roost, Pioneer Mail, and Sunrise. Shoe-box size (16 x 12 x 6, strictly enforced), durable and waterproof, labeled with name, bib, and station, in the bins by 5:30 AM race morning. Bags return to Lake Cuyamaca about an hour after each station closes and are never mailed; unclaimed gear is donated after the 4 PM mountain departure."
    tracking_note: "Live GPS tracking through Geo Tracks pods carried by runners (link emailed pre-race), with station-by-station times posted on ultralive.net and the live-cast link on the sandiego100.com home page."
  blurb: An old-school mountain 100 from Lake Cuyamaca over Stonewall and Cuyamaca Peaks, Noble Canyon, and the PCT with 32 hours to the buckle.
  about: >-
    The San Diego 100 Mile Endurance Run loops the east-county
    mountains from Lake Cuyamaca near Julian — around Stonewall Peak,
    up Cuyamaca Peak, through Green Valley and the Sweetwater river
    crossing, up Noble Canyon to the Lagunas, and home along the
    Pacific Crest Trail with the Salton Sea glittering below. About
    85 percent single track with just over 13,000 feet of climbing,
    sixteen chart rows of aid over fourteen stations, crews at seven,
    pacers from Sweetwater, GPS tracking, and 32 hours to earn the
    buckle at the 25th annual running.
  start_venue: Lake Cuyamaca, 15027 Highway 79, Julian, CA
  finish_venue: Lake Cuyamaca, 15027 Highway 79, Julian, CA

