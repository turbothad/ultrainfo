# Massanutten Mountain Trails 100 — event data (imported by Events::Import
# via db/seeds.rb). The 2027-frame VHTRC race page carries the race facts;
# the Course page's fifteen-station table carries the passes (with one
# impossible finish clock corrected by the Crew Instructions table and the
# 36-hour statement); the official course GPX is the geometry and
# elevation authority. Source decisions are documented in
# docs/research/massanutten-2027-source-audit.md.

race:
  name: Massanutten Mountain Trails 100
  slug: massanutten-100
  year: 2027
  state: VA
  distance_mi: 100.6 # The course table's cumulative frame; the official GPX GPS-measures 97.82.
  elevation_gain_ft: 18500 # The Course facts: 18,500 feet of total ascent/descent (the home page says more than 18,000; run100s' 19,000 has no counterpart).
  elevation_loss_ft: 18500
  start_date: 2027-05-15
  end_date: 2027-05-16
  start_time: 5:00 AM
  time_zone: America/New_York
  cutoff_hours: 36 # "There is a 36-hour cutoff" — the finish closes 5:00 PM Sunday (the course table's 3:00 pm print is corrected by the crews table).
  official_url: https://new.vhtrc.org/races/mmt
  registration_url: https://new.vhtrc.org/races/mmt/entry
  results_url: https://new.vhtrc.org/races/mmt/results
  registration_status: not_open # "Entry opens on Sat Oct 31, 2026 at 8:00 am" ($250, 250-person limit, via UltraSignup).
  lottery: false # First-come entry with a waitlist once the race fills.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "A rocky figure-8 over the ridges of the Massanutten Mountains in the George Washington National Forest from Caroline Furnace Lutheran Camp, Fort Valley, VA, by the Virginia Happy Trails Running Club. The race page is 2027-frame (Sat May 15, 2027 at 5:00 am; entry opens October 31, 2026). The course table's finish cutoff prints 3:00 pm — impossible against its own Gap Creek II clock (3:55 pm at 96.8) and the page's 36-hour statement — and the Crew Instructions table prints 5:00 pm, exactly 36 hours from the start, which governs; the crews table in turn prints Picnic Area at 12:50 am against the course table's ladder-consistent 12:50 pm, so each table corrects the other's single AM/PM misprint. Crew counts disagree across surfaces (the facts box says 8, the prose 9, the table checks 8, and the Crew Instructions list names 9 mid-race stations plus the finish, adding Gap Creek II — the same ground as crew-accessible Gap Creek I); the Crew Instructions list governs. Woodstock Tower and Powells Fort cutoffs are recommendation-only per the table's footnote. The Schedule page still carries the 2026 weekend; its structure is the standing pattern. run100s' 19,000-foot climb has no counterpart (18,500)."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
        verified_on: "2026-08-14"
      sources:
        verified_on: "2026-08-14"
    sources:
      - &source_race_page
        label: "MMT 100 race page (2027 date and start, entry opening, venue, 36 hours)"
        url: "https://new.vhtrc.org/races/mmt"
        verified_on: "2026-08-14"
      - &source_course
        label: "Course page (the fifteen-station table with cutoffs and footnotes, 100.6 miles, 18,500 feet, GPX link)"
        url: "https://new.vhtrc.org/races/mmt/course"
        verified_on: "2026-08-14"
      - &source_gpx
        label: "Official course GPX (track with elevations and 17 station waypoints)"
        url: "https://new.vhtrc.org/media/pages/races/mmt/course/c9a263be78-1779210606/vhtrc-mmt-100.gpx"
        verified_on: "2026-08-14"
      - &source_entry
        label: "Entry page ($250, 250-person limit, opens October 31, 2026, refunds, waitlist)"
        url: "https://new.vhtrc.org/races/mmt/entry"
        verified_on: "2026-08-14"
      - &source_crews
        label: "Crew Instructions page (crew-access station list with the 5:00 pm finish print)"
        url: "https://new.vhtrc.org/races/mmt/info/crews"
        verified_on: "2026-08-14"
      - &source_pacers
        label: "Pacers page (join points, one at a time, no muling, the 62-plus exception)"
        url: "https://new.vhtrc.org/races/mmt/info/pacers"
        verified_on: "2026-08-14"
      - &source_schedule
        label: "Schedule page (Friday check-in and drop-bag collection, 5:00 am start pattern; 2026 frame)"
        url: "https://new.vhtrc.org/races/mmt/info/schedule"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. The 2027 running is the club's 30th-anniversary era MMT with a 3:00 AM early start for runners over 60 on the standing schedule. About 10 climbs of 750 feet or more; the longest (1,550 feet in 2.5 miles) comes at mile 55 after Habron Gap; the high point is Bird Knob (2,835 feet, mile 81) and the low point 540 feet near mile 39. The course is marked with yellow tape (red bars wrong turns) with reflective night markings, and the club recommends PATC maps G and H. Woodstock Tower, Powells Fort, Indian Grave, and Bird Knob are remote stations where runners may not withdraw from the race except in serious medical condition. A Medical Emergency Plan lists directions to the nearest facilities from each station; no station-level medical service is published. Check-in and drop-bag collection run Friday 2:00-8:00 pm at the camp with a 4:00 pm briefing; all runners re-check in race morning. A Solo Division and Participants' Guide exist; the guide serves the prior year's copy until updated."
    overall_cutoff_label: "5:00 PM May 16, 2027"
    overall_cutoff_notes: "36 hours from the Saturday 5:00 AM start. The course table's ladder runs Edinburg Gap 8:50 am through Gap Creek II 3:55 pm Sunday; Woodstock Tower (11:30 am) and Powells Fort (1:15 pm) are recommendation-only per the footnote. The table's finish cell prints 3:00 pm — impossible against Gap Creek II's 3:55 pm — and the Crew Instructions table prints 5:00 pm, exactly 36 hours, which governs. Clocks from Camp Roosevelt on are Sunday."
    pacer_rule_summary: "One pacer at a time, joining at Camp Roosevelt (63.9; the Pacers page prints 63.5) or any crew-access station beyond, or at Habron Gap (54.0) after 6:00 PM Saturday. Runners 62 or older may take a pacer from Elizabeth Furnace (33.3). Pacers join only at aid stations, stay with their runner, let the runner lead, and carry nothing for them."
    drop_bag_summary: "Drop bags at ten stations per the course table: Edinburg Gap, Woodstock Tower, Elizabeth Furnace, Shawl Gap, Habron Gap, Camp Roosevelt, Gap Creek I, Visitor Center, Picnic Area, and Gap Creek II. Bags are collected at the camp Friday 2:00-8:00 pm; none may be submitted after 8:00 pm."
    tracking_note: "No live tracking link is published; results post on the club's results page."
  blurb: A rocky figure-8 over the Massanutten ridges from Caroline Furnace with 18,500 feet of climbing and 36 hours to the buckle.
  about: >-
    The Massanutten Mountain Trails 100 runs a top-heavy figure-8 over
    the ridges of the Massanutten Mountains in Virginia's Shenandoah
    Valley — north up the western ridge to Elizabeth Furnace, south
    along the eastern ridge to Gap Creek, then a second loop over
    Kerns Mountain and Bird Knob. The rocks are the point:
    short, rugged climbs totaling 18,500 feet, ridgelines that
    resemble piles of rocks in the woods, fifteen aid stations, crews
    at nine of them plus the camp, pacers from Camp Roosevelt, and 36
    hours from the 5:00 AM start. Massanutten Rocks!
  start_venue: Caroline Furnace Lutheran Camp, Fort Valley, VA
  finish_venue: Caroline Furnace Lutheran Camp, Fort Valley, VA

