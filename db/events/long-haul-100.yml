# Station passes: coordinates from the GPX waypoints (`match` = waypoint-name
# substring). Miles use the 2027 UltraSignup per-loop frame: South Loop at MM
# 3.3 and 8.5, Metal Mark Pond at MM 13.4, Day Use at MM 0.5 (loops 2-6 only),
# loop length 16.8. Later loops merge (`<<:`) the first passes and override
# what changes.
