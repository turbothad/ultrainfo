# Long Haul 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry copies the organizer's CalTopo course line; station
# coordinates are the organizer's CalTopo markers (the Day Use Area waypoint is
# placed at the organizer's MM 0.5 track point). Station-pass miles use the
# organizer's per-loop frame from the 2027 UltraSignup listing (South Loop at
# MM 3.3 and 8.5, Metal Mark Pond at MM 13.4, Day Use at MM 0.5, loops of 16.8
# miles); the race page's older MM 13.2 and mile-50.1 figures are recorded as
# conflicts. Source decisions are documented in
# docs/research/long-haul-100-2027-source-audit.md.

race:
  name: Long Haul 100
  slug: long-haul-100
  year: 2027
  state: FL
  distance_mi: 100
  elevation_gain_ft: null # No organizer figure; the park sits at 88-94 ft throughout.
  elevation_loss_ft: null
  start_date: 2027-01-16
  end_date: 2027-01-17
  start_time: 7:00 AM
  time_zone: America/New_York
  cutoff_hours: 32 # 7:00 AM Saturday start → 3:00 PM Sunday course cutoff.
  official_url: https://a1ultraevents.wordpress.com/long-haul-100/
  registration_url: https://ultrasignup.com/register.aspx?did=134998
  results_url: https://ultrasignup.com/results_event.aspx?did=123897
  registration_status: sold_out # 2027 UltraSignup listing: "Our 2027 event is sold out"; waitlist temporarily closed.
  lottery: false # Direct first-come UltraSignup registration that sold out; no lottery in any reviewed source.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "Organizer surfaces conflict on details: the 2027 UltraSignup listing says 6 loops of 16.8 miles with Metal Mark Pond at MM 13.4 and lists the mile-0.5 station as `Middle Lake AS = MM .05` (an evident typo for .5); the official race page says MM 13.2 and `Day Use Area` at MM .5, and its `pacers join at mile 50.1` sentence matches the prior 16.7-mile loop frame. This record uses the UltraSignup 16.8/13.4 frame, which the organizer's own CalTopo line supports (loop measures 16.82 miles; Metal Mark marker at line-mile 13.36). Six 16.8-mile loops total 100.8 miles against the billed 100. Spot elevations are USGS 3DEP queries at the station points; the organizer publishes no elevation figures."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_race_page
        label: "Long Haul 100 official race page (A1 Ultra Events)"
        url: "https://a1ultraevents.wordpress.com/long-haul-100/"
        verified_on: "2026-08-13"
      - &source_ultrasignup
        label: "2027 UltraSignup listing (start time, loops, cutoffs, stations, sold out)"
        url: "https://ultrasignup.com/register.aspx?did=134998"
        verified_on: "2026-08-13"
      - &source_handbook
        label: "LH100 Runner & Crew Handbook (2026 edition, updated 2025-11-11)"
        url: "https://a1ultraevents.wordpress.com/wp-content/uploads/2025/11/lh100-handbook.pdf"
        verified_on: "2026-08-13"
      - &source_caltopo
        label: "Organizer CalTopo course map (line and station markers)"
        url: "https://caltopo.com/m/558GS72"
        verified_on: "2026-08-13"
      - &source_usgs
        label: "USGS 3DEP Elevation Point Query Service (spot elevations)"
        url: "https://epqs.nationalmap.gov/v1/json"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Water is implied by full-service `hot and cold food and beverages` at every station but no source certifies potability. The 2026-edition handbook states there are no medical checks before, during, or after the race, so has_medical is false at every pass; first-aid supplies are stocked at the stations. The 30-hour Western States qualifying mark and the sub-24-hour silver buckle are performance marks, not runner cutoffs. Operational details sourced only from the 2026-edition handbook (schedule pattern, parking areas, drop-bag logistics) may change for 2027."
    overall_cutoff_label: "3:00 PM January 17, 2027"
    overall_cutoff_notes: "32 hours from the 7:00 AM Saturday start. No intermediate station cutoffs are published. Finishing under 30 hours earns a Western States qualifier; under 24 hours earns the silver buckle."
    pacer_rule_summary: "Pacers may join their runner during loops 4-6 (from the mile-50.4 end of loop 3 in this record's 16.8-mile frame; the race page's older sentence says mile 50.1). Runners 60 and older may have a pacer at any time. One pacer at a time, free mandatory registration and waiver, pacer bib required, no muling, no bicycles, and pacers start and pull out only at official stations."
    drop_bag_summary: "Drop bags are allowed in the pavilion at the start/finish and at Aid Station 1 (one bag, max 5-gallon size, delivered by race staff and returned periodically). The 2026-edition handbook carries the labeling and staging rules."
  blurb: Six flat 16.8-mile loops through longleaf pine flatwoods and cypress domes at Colt Creek State Park.
  about: >-
    The Long Haul 100 runs six 16.8-mile loops at Colt Creek State Park in
    Lakeland, FL — longleaf pine flatwoods, cypress domes, and open vistas on
    a flat, fully marked course. Start 7:00 AM Saturday; 32-hour course cutoff
    (3:00 PM Sunday) with a 30-hour Western States qualifying mark. Stations at
    the Mac Lake pavilion, the Day Use Area, the South Loop (passed twice each
    loop), and Metal Mark Pond. The 2027 race is sold out.
  start_venue: Mac Lake Pavilion, Colt Creek State Park, 16000 State Rte 471, Lakeland, FL
  finish_venue: Mac Lake Pavilion, Colt Creek State Park, 16000 State Rte 471, Lakeland, FL

