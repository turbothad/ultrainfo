    name: "Start — Mac Lake Pavilion"
    direction: "Start"
    mile: 0.0
    elev: 89
    crew: true
    water: true
    pacer: false
    drop: null
    food: true
    med: false
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "Full-service HQ station with hot and cold food and beverages, plus first-aid supplies. Drop bags for the start/finish and Aid Station 1 are staged at the pavilion on race morning."
    bathroom: null
    park: "No runner, crew, pacer, or spectator parking in the paved Mac Lake lot (ADA excepted). Assigned runner parking areas A-D; crews and spectators parallel-park along the main road opposite the lake. Park entry costs $4 per vehicle or $3 per person for non-runners."
    crew_notes: "Crew canopies may be set up along the paved path at the start/finish beyond the pavilion (Area D); crews can also self-crew from vehicles at the Area C grassy lot at mile 16.4 of each loop. Crew bicycles are prohibited."
    pacer_notes: "Pacers join during loops 4-6 — not at the start. Runners 60 and older may have a pacer at any time."
    road: null
    source_metadata: &official_station_source
      verification_status: warning
