# Badger Mountain Challenge 100 — event data (imported by Events::Import via
# db/seeds.rb). The 100-miler page on badgermountainchallenge.com and its
# linked aid station chart carry the station facts; the 2027 UltraSignup
# listing carries the current dates, start time, and registration opening;
# the page's linked GPX download is the geometry and elevation authority.
# Source decisions are documented in
# docs/research/badger-mountain-2027-source-audit.md.

race:
  name: Badger Mountain Challenge 100
  slug: badger-mountain-100
  year: 2027
  state: WA
  distance_mi: 100 # Two trips on the 50-mile out-and-back; the official GPX GPS-measures 99.00.
  elevation_gain_ft: 18431 # "There is 18,431' of climbing for the 100 miler" with matching loss on the out-and-back.
  elevation_loss_ft: 18431
  start_date: 2027-03-26
  end_date: 2027-03-27
  start_time: 7:00 AM
  time_zone: America/Los_Angeles
  cutoff_hours: 32.5 # "Course closes at 3:30 PM Saturday (32.5 hours)"; run100s' 32 has no counterpart.
  official_url: http://www.badgermountainchallenge.com/
  registration_url: https://ultrasignup.com/register.aspx?eid=2609
  results_url: https://ultrasignup.com/register.aspx?did=127508 # The 2026 listing carries the results tabs back to 2011.
  registration_status: not_open # The 2027 UltraSignup listing: "Registration Opens Mon. Nov 30, 2026 @ 12:00 AM PT".
  lottery: false # Direct registration when it opens; no qualifier ("There is no qualifying race for BMC so please be prepared").
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "Two trips on a 50-mile out-and-back from Badger Mountain Trailhead Park in Richland, WA over Badger and Candy Mountains and the Horse Heaven Hills to the Chandler Butte turnaround, hosted by the volunteer Nomad Trail Runners. The 2027 UltraSignup listing pins March 26-27, 2027 with the Friday 7:00 AM start and the November 30, 2026 registration opening, while the race site's pages and aid chart still carry the 2026 frame (the 100-miler page dates, the rules page's Rules (2026 race) heading, and the chart's 2026 sunset note); the chart's station miles, flags, and cutoff clocks match the 32.5-hour pattern the 2027 listing preserves. The chart prints Candy Mtn at loop-two mile 55 against the 50 + 4.6 arithmetic of every other row (its inbound twin sits at 95.4); the printed 55 governs that pass and the conflict is recorded. The official GPX is a route file (converted to a track in the bundle) that GPS-measures 99.00 miles against the chart's 100-mile frame. The two directional-only McBee Ridge rows sit about 0.9 mile apart on the line, so they carry separate outbound and inbound waypoints. run100s' 32-hour cutoff and 14,000-foot climb have no counterpart (32.5 hours; 18,431 feet)."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_home
        label: "Badger Mountain Challenge site home"
        url: "http://www.badgermountainchallenge.com/"
        verified_on: "2026-08-13"
      - &source_100_page
        label: "100-miler page (course, schedule pattern, drop bags, pacers, crews, GPX link)"
        url: "http://www.badgermountainchallenge.com/p/100-miler.html"
        verified_on: "2026-08-13"
      - &source_chart
        label: "100-mile aid station chart (Google Sheet linked from the 100-miler page)"
        url: "https://docs.google.com/spreadsheets/d/1aHQPNF9a4MOfIDb6mwB_3mLBb10kPbOP/edit"
        verified_on: "2026-08-13"
      - &source_gpx
        label: "Official 100-mile course GPX download (THE BMC 100MILER)"
        url: "https://drive.google.com/file/d/192WL02uAJCglSKFhpW7RqZAbVETtAkgU/view"
        verified_on: "2026-08-13"
      - &source_us_2027
        label: "UltraSignup 2027 registration page (March 26-27, 2027; opens November 30, 2026)"
        url: "https://ultrasignup.com/register.aspx?eid=2609"
        verified_on: "2026-08-13"
      - &source_us_2026
        label: "UltraSignup 2026 listing (results back to 2011)"
        url: "https://ultrasignup.com/register.aspx?did=127508"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. A 100% volunteer race benefiting the Badger Mountain Preserve open spaces. Check-in and drop-bag drop-off 5:30-6:30 AM at the Trailhead Park lower lot (1294 White Bluffs St., Richland) with a 6:40 AM briefing; an early 6:00 AM start is available by advance arrangement. The course mixes single track, rocky jeep trails, dirt roads, and about 15 total miles of pavement between 500 and 2,000 feet, with several steep 800-1,000-foot climbs; weather drives the high DNF rate (34 percent in three years) and hypothermia is a real risk on McBee ridge. Dogs may accompany 100-mile runners (leashed on Badger Mountain). Runners who drop must tell the aid captain or Race Director. All finishers earn a custom buckle, with sub-24 and five-year buckles."
    overall_cutoff_label: "3:30 PM March 27, 2027"
    overall_cutoff_notes: "The 100 closes at 3:30 PM Saturday, 32.5 hours from the Friday 7:00 AM start. Chart cutoffs: the 50-mile turnaround at 10:00 PM Friday, McBee parking at 3:00 AM and 7:30 AM, Jacobs Road at 12:00 PM, Candy Mtn at 1:30 PM, and the finish at 3:30 PM Saturday. Cut-off times will be adhered to."
    pacer_rule_summary: "One pacer at a time, joining only after the runner reaches the 50-mile turnaround at Trailhead Park; pacers may also join at the crew-accessible stations after 50 miles (Candy Mtn or McBee Parking). Pacers do not register — they pick up a bib at packet pickup or the start/finish — and should tell station volunteers where they join and leave. Station food is for entrants; pacers may eat but should bring their own."
    drop_bag_summary: "Two drop-bag locations: the start/finish and McBee Parking (passed at miles 18.5, 31.5, 68.5, and 81.5), dropped off race morning and transported for the runner; label with name, bib number, and station. Returns to the finish are best-effort."
    tracking_note: "No live tracking is published; results post on UltraSignup."
  blurb: Two trips on a 50-mile out-and-back over Badger and Candy Mountains and the Horse Heaven Hills above Richland.
  about: >-
    The Badger Mountain Challenge 100 runs two trips on a 50-mile
    out-and-back from Badger Mountain Trailhead Park in Richland, WA —
    over Badger and Candy Mountains, along the windswept Horse Heaven
    Hills and McBee ridge to the Chandler Butte turnaround and back,
    twice. Start 7:00 AM Friday with a 32.5-hour cutoff (3:30 PM
    Saturday) and chart cutoffs from the 50-mile turnaround on. About
    18,431 feet of climb on rocky jeep trails and single track where
    the weather, not the terrain, causes most DNFs. A 100% volunteer,
    home-grown race by the Nomad Trail Runners of Eastern Washington.
  start_venue: Badger Mountain Trailhead Park, 1294 White Bluffs St., Richland, WA
  finish_venue: Badger Mountain Trailhead Park, 1294 White Bluffs St., Richland, WA

