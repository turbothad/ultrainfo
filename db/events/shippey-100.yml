# Station passes: coordinates from the GPX waypoints (`match` = waypoint-name
# substring; waypoints are the organizer's markers). Miles are measured along
# the organizer's course line in the 2027 clockwise direction: Sverdrup at
# 5.2, 9.8, and 13.2 and Emerson mid-loop at 16.4 of each nominal 20-mile
# loop. Later loops merge (`<<:`) the Loop 1 passes and override what changes.
aid_stations:
  - match: "Emerson Start/Finish"
    name: "Start — Emerson Center"
    direction: "Start"
    mile: 0.0
    elev: 561
    crew: true
    water: true
    pacer: false
    drop: null
    food: true
    med: null
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "Indoor aid at the Emerson Center: standard ultramarathon foods with meal and snack items through the weekend (eggs, bacon, pancakes, burgers, quesadillas, broth among others). The race is cupless — bring your own cup or bottle. The timing mat is outside; runners go inside for aid."
    bathroom: "Bathrooms and showers are downstairs in the Emerson Center."
    park: "Main parking at the start/finish; 50K, 20M, and 25K runners park at Cub World and walk about 0.3 miles to Emerson."
    crew_notes: "Crews camp indoors 15 yards from the start/finish line and see their runner every 3-5.3 miles. Crew may give food, water, and aid only at the stations."
    pacer_notes: "Pacing begins after 40 miles (two loops) or 5:00 PM Saturday — not at the start. All pacers must register."
    road: null
    source_metadata: &official_station_source
      verification_status: warning
      source_label: "2027 UltraSignup listing"
      source_url: "https://ultrasignup.com/register.aspx?did=135549"
      verified_on: "2026-08-13"
      source_notes: "Verified on is the retrieval date, not the material's effective year. Fluids are served at both cupless stations but potability is not certified. Pass miles are measured along the organizer's course line in the 2027 clockwise direction (the loop measures 20.03 miles); the course reverses in even years. Spot elevations are the altitude values in the organizer's course line at the station markers."
