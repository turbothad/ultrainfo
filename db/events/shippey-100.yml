# The Shippey 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry copies the organizer's Google My Maps "Shippey 20 mile loop"
# line, drawn in the clockwise direction the race runs in odd years including
# 2027; station coordinates are the organizer's markers. Station-pass miles are
# measured along that line (Sverdrup at 5.2, 9.8, and 13.2; Emerson mid-loop at
# 16.4 of each nominal 20-mile loop). Source decisions are documented in
# docs/research/shippey-2027-source-audit.md.

race:
  name: The Shippey 100
  slug: shippey-100
  year: 2027
  state: MO
  distance_mi: 100
  elevation_gain_ft: null # No organizer figure; the organizer map's own altitudes total ~2,800 ft per loop.
  elevation_loss_ft: null
  start_date: 2027-01-16
  end_date: 2027-01-17
  start_time: 6:00 AM
  time_zone: America/Chicago
  cutoff_hours: 34 # 6:00 AM Saturday start → 4:00 PM Sunday final cutoff.
  official_url: https://theshippey.com/
  registration_url: https://ultrasignup.com/register.aspx?did=135549
  results_url: https://ultrasignup.com/results_event.aspx?did=135549
  registration_status: open # 2027 UltraSignup listing open at verification.
  lottery: false # Direct first-come UltraSignup registration; no lottery in any reviewed source.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "The course switches direction each year — clockwise in odd years like 2027, counterclockwise in even years — and the organizer's course line is drawn in the clockwise direction; even-year records would need the reverse frame. The 2027 UltraSignup listing still carries `January 18th` in its cutoff blurb, a leftover from the 2026 dates; the 2027 race runs January 16-17. The organizer publishes no elevation figures; the profile and station spot elevations use the altitude values embedded in the organizer's course line, and pass miles are measured along it (the loop measures 20.03 miles)."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_site
        label: "The Shippey official site"
        url: "https://theshippey.com/"
        verified_on: "2026-08-13"
      - &source_course_page
        label: "Course details page"
        url: "https://theshippey.com/course-details-1"
        verified_on: "2026-08-13"
      - &source_runner_info
        label: "Runner information page"
        url: "https://theshippey.com/runner-info/"
        verified_on: "2026-08-13"
      - &source_ultrasignup
        label: "2027 UltraSignup listing"
        url: "https://ultrasignup.com/register.aspx?did=135549"
        verified_on: "2026-08-13"
      - &source_mymaps
        label: "Organizer Google My Maps course map (KML export)"
        url: "https://www.google.com/maps/d/kml?mid=1PYJm-QOer7LvmGH4y4iRRRyYvocHGCI&forcekml=1"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. The race is cupless — runners bring their own cup or bottle; fluids and standard ultramarathon foods (the runner page lists eggs, bacon, pancakes, burgers, quesadillas, and broth among others) are served at both indoor stations, but no source certifies water potability and no medical service is published. The Sverdrup station closes at 2:00 PM Sunday, when all runners must be on leg 4 of the final loop (odd-year direction). The organizer warns that not completing leg 3 of the final loop by 1:00 PM makes the final cutoff unlikely. Live per-leg splits are posted through Final Lap Racing from timing mats at both stations."
    overall_cutoff_label: "4:00 PM January 17, 2027"
    overall_cutoff_notes: "34 hours from the 6:00 AM Saturday start. The Sverdrup station shuts at 2:00 PM Sunday and all runners must be on leg 4 of the final loop by then; the organizer advises that finishing leg 3 of the final loop after 1:00 PM makes the 4:00 PM finish unlikely."
    pacer_rule_summary: "Pacers are allowed any time after 40 miles (two loops) or after 5:00 PM Saturday for solo 100-mile and 100K runners. All pacers must register through the organizer's pacer entry; no pacers for the shorter distances."
    drop_bag_summary: "Drop bags are allowed at both indoor stations for solo runners and should not exceed 24x16x13 inches; larger bags may not be transported."
  blurb: Five 20-mile wooded loops at Beaumont Scout Reservation, indoors through both aid stations.
  about: >-
    The Shippey 100 runs five 20-mile loops on the Greater St. Louis Boy
    Scouts' Beaumont Scout Reservation at High Ridge, MO — about 75%
    single and double track with short 35-40% grade climbs, run clockwise in
    odd years like 2027. Two indoor stations serve every loop: Emerson at the
    start/finish (passed twice per loop) and Sverdrup Lodge (three times per
    loop). Start 6:00 AM Saturday; 34-hour limit (4:00 PM Sunday) with the
    Sverdrup station closing at 2:00 PM Sunday.
  start_venue: Emerson Center, Beaumont Scout Reservation, 6480 Beaumont Reservation Drive, High Ridge, MO
  finish_venue: Emerson Center, Beaumont Scout Reservation, 6480 Beaumont Reservation Drive, High Ridge, MO

