# Viper 100 — event data (imported by Events::Import via db/seeds.rb).
# The 2027 UltraSignup listing is the primary source for every race fact:
# dates, starts, the 41-hour cutoff, the per-loop aid table, crew, pacer,
# and drop-bag rules. Course geometry copies the page's embedded plotaroute
# loop; elevations are USGS 3DEP spot values. Source decisions are
# documented in docs/research/viper-2027-source-audit.md.

race:
  name: Viper 100
  slug: viper-100
  year: 2027
  state: TN
  distance_mi: 100.2 # Three 33.4-mile loops; the 107K is billed as two loops (66.8 miles) on the same frame.
  elevation_gain_ft: null # No organizer prose figure; the linked plotaroute loop computes 324 m (~1,063 ft) per loop, ~3,190 ft over three.
  elevation_loss_ft: null
  start_date: 2027-03-19
  end_date: 2027-03-20
  start_time: 7:00 AM
  time_zone: America/Chicago
  cutoff_hours: 41 # Friday 7:00 AM to "Midnight on Saturday, March 20, 2027" — daylight saving time is already in effect.
  official_url: https://www.mambatrailrunners.com/
  registration_url: https://ultrasignup.com/register.aspx?did=137755
  results_url: https://ultrasignup.com/results_event.aspx?did=137755
  registration_status: open # The 2027 UltraSignup listing sells all four distances ($250 for the 100).
  lottery: false # Direct UltraSignup registration.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "A three-loop race on a 33.4-mile Shelby Farms Park loop in Memphis, TN, sharing race weekend with the 107K (two loops), 53K, and 25K; every distance finishes at Hyde Lake Pavilion. The 2027 UltraSignup listing carries the complete race manual (dates, cutoff, per-loop aid table, crew, pacer, and drop-bag rules) and embeds the course as plotaroute route 3232103 — drawn February 18, 2026 by Mamba Trail Runners founder James Boler and named `Viper 300 Route 2026`, and GPS-measuring 33.43 miles against the billed 33.4, which governs pass miles. Four physical stations produce six passes per loop: Bridge is visited at loop miles 7.4 and 14.4 (the two track passes run 61 feet apart) and Tour de Wolf at 20.8 and 27.0 (the two passes cross about 0.18 mile apart across the pavilion area; the waypoint sits at the first pass). No intermediate cutoffs are published — only the 41-hour finish. run100s' row is stale twice: its 3/12-13/27 dates and 38-hour cutoff have no counterpart on the 2027 listing (March 19-20, 41 hours)."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_ultrasignup
        label: "UltraSignup 2027 registration page (the organizer's full race manual)"
        url: "https://ultrasignup.com/register.aspx?did=137755"
        verified_on: "2026-08-13"
      - &source_mamba
        label: "Mamba Trail Runners site home"
        url: "https://www.mambatrailrunners.com/"
        verified_on: "2026-08-13"
      - &source_plotaroute
        label: "Course loop on plotaroute (route 3232103, embedded on the 2027 listing)"
        url: "https://www.plotaroute.com/route/3232103"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Rules from the 2027 listing: no dropping down in distance (register for the 100, finish 100 miles or DNF); no muling; crew may assist only at fully manned aid stations and no outside assistance is allowed anywhere else; stay on the marked course; drop bags only at designated stations and no caching supplies; the course must be completed on foot; an IV, oxygen, or serious injury ends the race; trekking poles and headphones allowed with courtesy rules. Race parking is at the Tour de Wolf Pavilion parking area, where runners pass their vehicles twice each loop. Packet pickup is Thursday, March 18, 3:00-7:00 PM at Hyde Lake Pavilion and reopens at 9:00 AM Friday. Registrations are non-refundable and non-transferable; deferral credits run 50% at 60 days out and 25% at 30 days out, with none after March 1, 2027."
    overall_cutoff_label: "12:00 AM March 21, 2027"
    overall_cutoff_notes: "41 hours from the Friday 7:00 AM start — the listing words it as all race distances concluding at Midnight on Saturday, March 20, 2027, and notes daylight saving time is already in effect. No intermediate cutoffs are published."
    pacer_rule_summary: "Pacers are permitted for the 100 Mile and 107K only, one on course at a time, after the runner completes one full loop (33.4 miles). Once eligible, a pacer may join at any crew-accessible station during the second loop — Refuge, Tour de Wolf, or Hyde Lake Pavilion — and pacer swaps happen at crew-accessible stations. Pacers sign a waiver, wear a pacer bib, may not carry any supplies for their runner, and must enter and leave stations with their runner."
    drop_bag_summary: "Drop bags are permitted at Hyde Lake Pavilion (start/finish) and the Tour de Wolf Aid Station only, clearly labeled with name and race distance. No caching of food, water, or gear anywhere on the course."
    tracking_note: "The 2027 listing says 100 mile and 100k runners will be live tracked; no tracking service or public link is published yet."
  blurb: Three 33.4-mile loops of greenway and dirt trail through Shelby Farms Park, one of the country's largest urban parks.
  about: >-
    The Viper 100 runs three 33.4-mile loops inside Shelby Farms Park in
    Memphis, TN, mixing smooth paved greenways with winding dirt trails
    past lakes, forests, and the park's famous buffalo pasture. Start
    7:00 AM Friday with a 41-hour cutoff — every distance on race
    weekend finishes at Hyde Lake Pavilion by midnight Saturday. Four
    stations serve six aid passes per loop, crews meet runners at three
    of them plus the start/finish hub, and race parking at the Tour de
    Wolf Pavilion puts runners past their own vehicles twice a loop.
  start_venue: Hyde Lake Pavilion, Shelby Farms Park, Memphis, TN
  finish_venue: Hyde Lake Pavilion, Shelby Farms Park, Memphis, TN

