# Huron 100 — event data (imported by Events::Import via db/seeds.rb).
# The thehuron100.com home page banners the June 12, 2027 running and
# the UltraSignup 2027 listing carries the date and the September 1,
# 2026 registration opening; the organizer's HelloDrifter interactive
# map — linked from both — publishes the course line, the elevation
# profile, and the station markers with miles, crew/pacer/drop-bag
# flags, and the cutoff ladder. Source decisions are documented in
# docs/research/huron-2027-source-audit.md.

race:
  name: Huron 100
  slug: huron-100
  year: 2027
  state: MI
  distance_mi: 100 # The finish marker prints 100 miles; the organizer route GPS-measures 100.07-100.12.
  elevation_gain_ft: 8200 # The home page's "8200 ft cumulative gain"; the 2027 listing's description says roughly 8,000 and the organizer route publishes 2,420 m (7,940). run100s matches 8,200.
  elevation_loss_ft: 7950 # The organizer route's 2,423 m of descent converted - the only published loss figure.
  start_date: 2027-06-12
  end_date: 2027-06-13
  start_time: 9:00 AM
  time_zone: America/Detroit
  cutoff_hours: 32 # "32 hour time limit for the 100 mile" per the FAQ - the finish closes 5:00 PM Sunday (run100s' 33 has no counterpart).
  official_url: https://www.thehuron100.com
  registration_url: https://ultrasignup.com/register.aspx?did=142357
  results_url: https://ultrasignup.com/results_event.aspx?did=129465 # UltraSignup hosts the results (2026 shown; tabs back to 2024).
  registration_status: not_open # The 2027 listing prints "Registration Opens Tue. Sep 1, 2026 @ 12:00 AM ET".
  lottery: false # "No, we are happy to announce there is no formal lottery" - capped at 350 runners.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "The Huron 100 near Whitmore Lake, MI: 100 miles point to point across the Huron River Watershed, from the Portage Lake boat launch at Waterloo State Recreation Area to Proud Lake Recreation Area Headquarters, through nine parks (six state recreation areas, two Metroparks, one county park) in Southeast Michigan. The home page banners Saturday June 12th, 2027 (100M at 9:00 AM, 32 hours) and the UltraSignup 2027 listing carries the same date with registration opening September 1, 2026 - recorded not yet open. The FAQ and the listing's description body are still 2026-vintage and supply the standing rules (the Warbird pattern). The organizer's HelloDrifter interactive map - the site's Interactive Map button and the 2027 listing's course-map link, at the huron-100-2026 event URL - is the geometry, elevation, and station authority: its markers print each station's mile, crew/pacer/drop-bag flags, and cutoff clock, and its route publishes the full line and elevation profile. Station count is 16 (the map's sixteen aid-station markers and the FAQ's sixteen) against the listing description's fifteen - the map governs, and its two markers labeled AS 15 (Hickory Shelter and Windfall Hill) are a numbering typo documented here. Climb prints disagree: the home page's 8,200 governs, with the listing's roughly 8,000 and the route's 2,420 m (7,940) documented; the route's 2,423 m descent (7,950) is the only loss figure. The map's cutoff clocks are the 2026 running's, but the 2027 frame keeps the same Saturday 9:00 AM start and 32-hour window, so the elapsed-minute ladder carries over. The map's GPX download is account-gated; the map's own published embed data (route line, elevation chart, markers) is the open surface, and one stray Critical Turn marker plotted 40 miles off-course near Monroe is excluded."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
        verified_on: "2026-08-14"
      sources:
        verified_on: "2026-08-14"
    sources:
      - &source_home
        label: "thehuron100.com home (the June 12, 2027 banner, 8,200-foot climb, 82% trail, 32 hours, shuttles)"
        url: "https://www.thehuron100.com"
        verified_on: "2026-08-14"
      - &source_course
        label: "Course page (the mile-by-mile narrative, park sequence, and pacer prose)"
        url: "https://www.thehuron100.com/course"
        verified_on: "2026-08-14"
      - &source_faq
        label: "FAQ page (sixteen aid stations, the station menu, the 350 cap, no lottery, the 32-hour window)"
        url: "https://www.thehuron100.com/faq"
        verified_on: "2026-08-14"
      - &source_listing
        label: "UltraSignup 2027 listing (June 12, 2027; registration opens September 1, 2026; start and finish addresses; shuttles)"
        url: "https://ultrasignup.com/register.aspx?did=142357"
        verified_on: "2026-08-14"
      - &source_map
        label: "Organizer HelloDrifter interactive map (the course line, elevation profile, and station markers with miles, flags, and cutoffs)"
        url: "https://www.hellodrifter.com/events/huron-100-2026"
        verified_on: "2026-08-14"
      - &source_results
        label: "UltraSignup results (the 2026 running; tabs back to 2024)"
        url: "https://ultrasignup.com/results_event.aspx?did=129465"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. Registration opens September 1, 2026 on UltraSignup, capped at 350 runners with no lottery. Aid stations serve warm food, broth, Tailwind, snacks, fruit, potatoes, and pickles; four of the sixteen are hydration-only with no volunteers. The race is a 501(c)(3) public charity benefiting the Huron River Watershed, striving to be cupless and zero waste - finishers inside 32 hours take a belt buckle. Morning shuttles run from both finish locations to the shared start (Proud Lake departs 7:15 AM sharp); packet pickup is the Friday evening before at Proud Lake's River Hawk Annex (2026 pattern). The course is 82% trail per the home page (the listing's surface table says 80% trail, 9% bike path, 7% dirt road) with a maximum elevation around 1,100 feet."
    overall_cutoff_label: "5:00 PM June 13, 2027"
    overall_cutoff_notes: "32 hours from the Saturday 9:00 AM start. The organizer map prints a ten-clock ladder: Park Lyndon East 5:15 PM and Silver Lake 8:45 PM Saturday, then Lakeland Trail 12:15 AM, Maple Shelter 3:00 AM, Sandhill Shelter 6:00 AM, Huron Meadows 8:00 AM, Spring Mill Pond 12:00 PM, Hickory Shelter 2:00 PM, Windfall Hill 3:00 PM, and the finish 5:00 PM Sunday."
    pacer_rule_summary: "Pacer flags follow the organizer map: pacers are available from Lakeland Trail (47.1) onward at Sandhill Shelter, Huron Meadows, Spring Mill Pond, Hickory Shelter, and Windfall Hill - the course page calls Chambers Road, just past the Lakeland Trail station, the first opportunity to pick up pacers, and notes pacers running alongside at Huron Meadows."
    drop_bag_summary: "Drop bags per the organizer map wait at Park Lyndon East (24.4), Lakeland Trail (47.1), and Huron Meadows (69.5), with bags also at the finish; the start-area Runner Check-in marker at the Lakeview shelter is the bag drop-off point."
    tracking_note: "Live tracking and streaming are a monumental part of the Huron 100 vision - the 2026 running tracked at live.enabledtracking.com/huron2026; results post on UltraSignup."
  blurb: 100 point-to-point miles across the Huron River Watershed through nine parks, with sixteen aid stations and 32 hours from the Saturday 9:00 AM start.
  about: >-
    The Huron 100 runs 100 miles point to point across Southeast
    Michigan's Huron River Watershed - from the Waterloo-Pinckney
    Trail's sandy hills through the Potawatomi, Lakelands, Brighton,
    Huron Meadows, Island Lake, and Kensington trail systems to the
    Proud Lake finish - crossing nine parks on a course that is about
    82% trail with roughly 8,200 feet of climb. Sixteen aid stations
    include four hydration-only stops' worth of water support - twelve
    staffed stations with warm food and Tailwind - eight of them
    crew-accessible, pacers join from Lakeland Trail at 47.1, and the
    organizer map's cutoff ladder runs to a 5:00 PM Sunday finish
    inside 32 hours.
  start_venue: Portage Lake boat launch, Waterloo State Recreation Area, 11500 Seymour Rd, Grass Lake, MI
  finish_venue: Proud Lake Recreation Area Headquarters, Commerce Charter Township, MI

