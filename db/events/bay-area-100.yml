# Bay Area 100 — event data (imported by Events::Import via
# db/seeds.rb). The bayarea100.com home page banners the June 12, 2027
# second running and the UltraSignup 2027 listing carries the 5:00 AM
# start, open enrollment, and the December 8 close; the 2026 Athlete
# Guide's aid table governs station miles, crew/gear-bag/pacer flags,
# and the cutoff ladder; the official course GPX (with altitudes and
# station waypoints) is the geometry and elevation authority. Source
# decisions are documented in
# docs/research/bay-area-2027-source-audit.md.

race:
  name: Bay Area 100
  slug: bay-area-100
  year: 2027
  state: CA
  distance_mi: 100.7 # The guide table and pace chart end at 100.7; the official GPX GPS-measures 100.28.
  elevation_gain_ft: 18000 # The home page's "18,000ft of vertical gain"; the pace chart's segments sum to 18,447 (run100s prints 18,263).
  elevation_loss_ft: 17103 # The pace chart's segment descents summed - the only published loss figures.
  start_date: 2027-06-12
  end_date: 2027-06-13
  start_time: 5:00 AM
  time_zone: America/Los_Angeles
  cutoff_hours: 33 # "a 33-hour time limit" per The Race page - the finish closes 2:00 PM Sunday.
  official_url: https://bayarea100.com
  registration_url: https://ultrasignup.com/register.aspx?did=141132
  results_url: https://ultrasignup.com/register.aspx?did=141132 # UltraSignup hosts the results (the 2026 tab).
  registration_status: open # Open enrollment began August 3 per the 2027 listing's timeline; registration closes December 8, 2026.
  lottery: false # Rolling registration with entry review, then a first-come waitlist; capped at 300.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "The Bay Area 100 (Scena Performance): 100.7 miles point to point through the East Bay, from the gates of California Memorial Stadium in Berkeley over Bay View, Las Trampas, Lake Chabot, and Redwood territory to Skyline High School in Oakland. The home page banners the second running on June 12, 2027, and the UltraSignup 2027 listing carries the Saturday 5:00 AM start, the 300-runner cap, open enrollment from August 3, and the December 8 close - recorded open. The 2026 Athlete Guide (revised April 27, 2026) is the standing structure until the 2027 guide lands (the listing says mid-August, the home page early September - the Warbird pattern): its aid table governs miles, crew/gear-bag/pacer flags, and the thirteen-clock cutoff ladder, and the same 5:00 AM start and 33-hour window carry the elapsed minutes into 2027. Mile frames disagree in the small: the guide table governs against the pace chart's 25.6/31.4/35.5/68.0/70.8/74.3, the gear-bag prose's Wildcat Canyon 15.95, and the crew prose's Bort Meadow 82.95 - each documented on its pass. Climb prints disagree: the home page's 18,000 governs the gain (the pace chart's segments sum to 18,447; run100s prints 18,263), and the chart's summed descents (17,103) are the only loss figures. The 2027 listing prints two deltas from 2026: no early start this year, and cutoffs starting at 10:00 AM (matching the guide table's first clock against The Race page's stale 11:30 AM). The official GPX carries the full line with altitudes (6,156 points, GPS 100.28 scaled to 100.7) and all twenty station waypoints, each sitting exactly on the line."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
        verified_on: "2026-08-14"
      sources:
        verified_on: "2026-08-14"
    sources:
      - &source_home
        label: "bayarea100.com home (the June 12, 2027 banner, 18,000-foot climb, 33 hours, the Western States qualifier print)"
        url: "https://bayarea100.com/"
        verified_on: "2026-08-14"
      - &source_race
        label: "The Race page (the guide, pace chart, Strava, and GPX links; buckles; the stale 11:30 AM cutoff print)"
        url: "https://bayarea100.com/the-race/"
        verified_on: "2026-08-14"
      - &source_plan
        label: "Planning page (crew rules, the Lake Chabot and Bort Meadow restrictions, pacer registration, gear bags)"
        url: "https://bayarea100.com/planning/"
        verified_on: "2026-08-14"
      - &source_guide
        label: "2026 Athlete Guide (the governing aid table with miles, flags, and cutoffs; pacer and gear-bag rules)"
        url: "https://drive.google.com/file/d/1RfYYAK0eQzhM27-z04lMd-BwXUxkL1Ir/view"
        verified_on: "2026-08-14"
      - &source_pace
        label: "Pace chart sheet (segment miles, per-segment gain and loss, the cutoff clocks)"
        url: "https://docs.google.com/spreadsheets/d/1Rs4X2-qInwaNJ9b4iysUnaQmb5JqJVPI"
        verified_on: "2026-08-14"
      - &source_gpx
        label: "Official course GPX with stations (the full line with altitudes and twenty station waypoints)"
        url: "https://bayarea100.com/wp-content/uploads/2026/06/Bay_Area_100-with-stations.gpx"
        verified_on: "2026-08-14"
      - &source_listing
        label: "UltraSignup 2027 listing (June 12, 2027 at 5:00 AM; the registration timeline and cap; the 2027 deltas; 2026 results)"
        url: "https://ultrasignup.com/register.aspx?did=141132"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. The field is capped at 300 (open enrollment to 200, then the waitlist; Waitlist Wednesday lands December 9). A qualifying time is recommended rather than required: a 50-mile race within the year, with an exception request available during pre-registration. The race is a 2028 Western States qualifier and a UTMB Index race; entries defer up to 30 days out as a full rollover to 2028. Bib pickup is mandatory on the Thursday or Friday at Sports Basement Berkeley - no race-day pickup - and gear bags (14 liters, 10 pounds, bib-marked) drop there too. Two buckles: One Day metal under 24 hours and True Grit metal under 33. The course is marked with pink ribbon and directional signs; one pacer at a time, no muling (a disqualification), and pacers register free on UltraSignup and wear a pacer bib. Aid stations pour Skratch and GU. The 2027 listing says there will be no early start this year. Crews camp overnight at the Bort Meadow base camp (75 parking spaces, reserved through the race questionnaire); the Space Center lot is the unlimited-parking alternative a 0.2-mile walk from its station."
    overall_cutoff_label: "2:00 PM June 13, 2027"
    overall_cutoff_notes: "33 hours from the Saturday 5:00 AM start. The guide table prints a thirteen-clock ladder: Wildcat Canyon 10:00 AM, Steam Trains 1:00 PM, Valle Vista 4:15 PM, Rancho Laguna 5:15 PM, Las Trampas 7:15 PM, Chabot Staging 11:30 PM Saturday, then Clyde Woolridge 2:00 AM, Bort Meadow 3:00 AM, Space Center 5:20 AM, Bort Meadow 8:15 AM, Marciel 10:00 AM and 12:00 PM, and the finish 2:00 PM Sunday."
    pacer_rule_summary: "Pacers start at Chabot Staging (56.6) - or early at Las Trampas (46) for runners arriving after 6:00 PM - and can be changed at Lake Chabot Marina, Bort Meadow (all three passes), and Space Center. One pacer at a time, no muling; every pacer registers free on UltraSignup and picks up a pacer bib."
    drop_bag_summary: "Gear bags (up to 14 liters and 10 pounds, marked with name and bib number) wait at Wildcat Canyon, Rancho Laguna, Las Trampas, Chabot Staging, Lake Chabot Marina, and all three Bort Meadow passes, plus the finish; bags drop at Basecamp on Thursday or Friday and return to the finish as stations close."
    tracking_note: "Live runner tracking runs along the course with a YouTube live stream; the runner tracking link posts on bayarea100.com, and results post on UltraSignup."
  blurb: 100.7 point-to-point miles across the East Bay from Cal Memorial Stadium to Skyline High School, with 18,000 feet of climb and 33 hours from the 5:00 AM start.
  about: >-
    The Bay Area 100 crosses the East Bay point to point - from the
    gates of California Memorial Stadium over Grizzly Peak, through
    Tilden, Wildcat Canyon, Sibley, and Redwood country, out to Las
    Trampas, and around Lake Chabot to the Skyline High School finish
    in Oakland - 100.7 miles with about 18,000 feet of climb. The
    guide table runs twenty-five passes over twenty stations with a
    thirteen-clock cutoff ladder inside the 33-hour window, eleven
    crew points, gear bags at six stations plus the finish, and
    pacers from Chabot Staging at 56.6 (or Las Trampas after dark).
    Finishers take the One Day buckle under 24 hours or True Grit
    under 33.
  start_venue: California Memorial Stadium, Berkeley, CA
  finish_venue: Skyline High School, Oakland, CA

