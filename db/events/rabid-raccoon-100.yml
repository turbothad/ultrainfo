# Four Seasons at base+1.96, the water station at base+6.19, Four Seasons
# at base+8.64, The Rec Center at each loop end; loop eight's second
# Four Seasons pass carries the printed 95.5), and the Finish. In-loop
# miles are the organizer route's scaled crossings because no
# within-loop chart exists (the loops have no Turnaround rows, so mid
