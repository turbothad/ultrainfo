        label: "Rabid Raccoon 100 RunSignup site (2027 dates, the 100-mile card, open registration)"
        url: "https://runsignup.com/Race/PA/Hookstown/RabidRaccoon100"
        verified_on: "2026-08-14"
      - &source_aid
        label: "Aid Stations page (three stations per loop, 23 staffed passes, stocking, the water-only station)"
        url: "https://runsignup.com/Race/RabidRaccoon100/Page/Aid-Stations"
        verified_on: "2026-08-14"
      - &source_crew
        label: "Crew Access page (both stations crew-accessible, pins, the Bradys Run Road closure)"
        url: "https://runsignup.com/Race/RabidRaccoon100/Page/Crew-Access"
        verified_on: "2026-08-14"
      - &source_faq
        label: "FAQs page (36 hours, the firm leave-by cutoffs at 95.5 and the finish, drop bags, the loop)"
        url: "https://runsignup.com/Race/RabidRaccoon100/Page/FA-Qs"
        verified_on: "2026-08-14"
      - &source_plotaroute
        label: "Organizer plotaroute 100-mile course (line, station markers, ascent)"
        url: "https://www.plotaroute.com/route/2675516"
        verified_on: "2026-08-14"
      - &source_epqs
        label: "USGS 3DEP point elevation service (series and station spots; the route carries no altitudes)"
        url: "https://epqs.nationalmap.gov/v1/json"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. A Western States qualifier (all 100-mile finishers qualify). Packet pickup runs Friday 11:00 AM - 8:00 PM at the Brady's Run Park Recreation Facility (121 Brady's Run Road, Beaver Falls, PA) during the Visit Beaver County Rabid Raccoon Expo, with a $100 charge for race-day pickup. Stations stock first aid kits, water, Gatorade, soda, pizza, PB&J, bagels, cookies, bananas, granola bars, and candy, with the detailed menu emailed closer to race day. The course is marked with reflective neon-yellow markers, arrows, and caution tape on wrong turns; trail shoes are recommended for the creek crossing and mud. No refunds (FanShield insurance offered); transfers until one month out; deferrals to other Wolf Creek races with an administrative fee. The 100k and shorter distances share the loop; dropping down after the transfer deadline scores a DNF. Finishers take a custom belt buckle, and the site offers live text notifications for followers."
    overall_cutoff_label: "4:00 PM June 6, 2027"
    overall_cutoff_notes: "36 hours from the Saturday 4:00 AM start. Cutoffs are firm and leave-by - departure times, not arrival times; if you are not out of the station by the cutoff, your race is over. Two clocks: Four Seasons at mile 95.5 by 2:00 PM Sunday, and The Rec Center finish at 4:00 PM Sunday."
    pacer_rule_summary: "Pacers (100 mile and 100K only) register online for $15, are open to ages 14 and up, must wear a pacer bib, and may join 100-mile runners after 50 miles - four loops completed."
    drop_bag_summary: "Drop bags may wait at each staffed station - the Four Seasons Pavilion and The Rec Center - labeled with race number and name (duct tape and markers at registration). Bags return to the start after the stations shut down; runners or crew may also drive to the stations to retrieve them early."
    tracking_note: "Live text notifications are offered through the site's Live Text Notifications page; results post on RunSignup."
  blurb: Eight 12.5-mile loops at Brady's Run Park with a creek crossing, two crewable stations, and 36 firm hours from the 4:00 AM start.
  about: >-
    The Rabid Raccoon 100 runs eight 12.5-mile loops through Brady's
    Run Park in Beaver County, Pennsylvania - mostly single track
    with gravel, pavement, grass, a creek crossing, and about 15,000
    feet of climbing. The Rec Center anchors every loop with Four
    Seasons hit twice and an unmanned water-only station between, crews camp
    at both staffed stations, drop bags wait at each, and the
    cutoffs are firm departure times: out of Four Seasons at 95.5 by
    2:00 PM Sunday and across the line by 4:00 PM for the custom
    buckle.
  start_venue: Brady's Run Park Recreation Facility (The Rec Center), 121 Brady's Run Road, Beaver Falls, PA
  finish_venue: Brady's Run Park Recreation Facility (The Rec Center), 121 Brady's Run Road, Beaver Falls, PA

