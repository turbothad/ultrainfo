# Rabid Raccoon 100 — event data (imported by Events::Import via
# db/seeds.rb). The 2027-frame RunSignup site carries the race facts
# (open registration, the June 5 4:00 AM start, the 36-hour window);
# the FAQs carry the firm leave-by cutoffs; the organizer plotaroute
# course and its station markers are the geometry authority; USGS 3DEP
# point elevations supply the profile because the plotaroute data
# carries no altitudes. Source decisions are documented in
# docs/research/rabid-raccoon-2027-source-audit.md.

race:
  name: Rabid Raccoon 100
  slug: rabid-raccoon-100
  year: 2027
  state: PA
  distance_mi: 100 # Eight 12.5-mile loops; the organizer plotaroute route GPS-measures 100.25.
  elevation_gain_ft: 15079 # The plotaroute route's 4,596 m of ascent converted; the only published total (run100s' 16,900 has no counterpart).
  elevation_loss_ft: 15075 # The route's 4,595 m of descent converted.
  start_date: 2027-06-05
  end_date: 2027-06-06
  start_time: 4:00 AM
  time_zone: America/New_York
  cutoff_hours: 36 # "The 100 mile has 36 hours" — the finish closes 4:00 PM Sunday.
  official_url: https://runsignup.com/Race/PA/Hookstown/RabidRaccoon100
  registration_url: https://runsignup.com/Race/PA/Hookstown/RabidRaccoon100
  results_url: https://runsignup.com/Race/Results/116636 # RunSignup hosts the results.
  registration_status: open # The 2027 100-mile card sells at $250 (strikethrough $350).
  lottery: false # Direct RunSignup registration.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "The 6th annual Rabid Raccoon 100 at Brady's Run Park, Beaver County, PA (Wolf Creek Race Management): eight 12.5-mile loops of single track, gravel, pavement, and grass with a creek crossing, from The Rec Center with Four Seasons hit twice per loop and one unmanned water-only station (the Aid Stations page's water stop). The home and Race Info cards are 2027-frame (June 4-6, 2027; the 100 from 4:00 AM June 5 to 4:00 PM June 6) while the FAQs still print 2026 clocks - the cards govern dates and the FAQs supply the standing rules. No chart of within-loop miles exists: in-loop station miles are the organizer route's scaled crossings (Four Seasons 1.96 and 8.64, the water station 6.19, The Rec Center 12.5), and the organizer's only printed mid-course mile - Four Seasons at MILE 95.5 in the cutoff schedule - sits 0.75 below the line's scaled crossing for that pass, so the printed 95.5 governs it with a note. Cutoffs are firm and leave-by: departure times, not arrival times. Pacers (100 mile and 100K only) register online for $15, wear a pacer bib, and join the 100 after 50 miles - four loops completed. run100s' 16,900-foot climb has no counterpart (the route publishes 4,596 m / 15,079 ft)."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
