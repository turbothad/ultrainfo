# Bighorn 100 — event data (imported by Events::Import via db/seeds.rb).
# REAL: course track + aid-station coords come from bighorn-100.gpx (official).
# VERIFIED 2026-07-02 against the official Course Description + Aid Station Chart PDFs
#   (linked from https://bighorntrailrun.com/100-mile) and bhtr.itsyourrace.com:
#   miles, crew/pacer/drop flags, cutoffs, spot elevations, total gain/loss, 2026 date,
#   registration platform. Entry fee isn't published there — and we don't display fees.

race:
  name: Bighorn 100
  slug: bighorn-100
  year: 2026
  state: WY
  distance_mi: 100
  elevation_gain_ft: 20500 # official course description PDF ("The Big Picture")
  elevation_loss_ft: 20750
  start_date: 2026-06-19
  end_date: 2026-06-20
  start_time: 9:00 AM
  time_zone: America/Denver
  cutoff_hours: 35 # 9:00 AM start → 8:00 PM next-day cutoff
  official_url: https://bighorntrailrun.com/100-mile
  registration_url: https://bhtr.itsyourrace.com/event.aspx?id=384 # ITS YOUR RACE — official platform
  results_url: https://bhtr.itsyourrace.com/Results.aspx?id=384
  registration_status: closed # 2026 filled from the wait list; race ran June 19–20
  lottery: false
  source_metadata:
    verification_status: verified
    verified_on: "2026-07-02"
    sources:
      - label: "Official Bighorn 100 page"
        url: "https://bighorntrailrun.com/100-mile"
        fetched_on: "2026-06-26"
        verified_on: "2026-07-02"
        notes: "Race overview, schedule, registration links, and official course documents."
      - label: "Official Course Description PDF"
        url: "https://bighorntrailrun.com/100-mile"
        verified_on: "2026-07-02"
        notes: "Course distance, elevation totals, terrain, and race logistics."
      - label: "Official Aid Station Chart PDF"
        url: "https://bighorntrailrun.com/100-mile"
        verified_on: "2026-07-02"
        notes: "Aid station passes, miles, cutoffs, crew access, drop bags, and pacer points."
      - label: "ITS YOUR RACE registration page"
        url: "https://bhtr.itsyourrace.com/event.aspx?id=384"
        verified_on: "2026-07-02"
        notes: "Official registration status and event entry page."
      - label: "Official 2026 results"
        url: "https://bhtr.itsyourrace.com/Results.aspx?id=384"
        verified_on: "2026-07-15"
        notes: "Official published race results."
    notes: "Race facts, aid station miles, cutoffs, access flags, and course totals are sourced from official race materials represented in this file."
    overall_cutoff_label: "8:00 PM June 20, 2026"
    crew_drive_label: "Start to Dry Fork to Sally's to Jaws to Finish"
    pacer_rule_summary: "Pacers are for 100-mile runners only. Standard pacer pickup points are Sally's Footbridge outbound, Jaws Trailhead, Sally's Footbridge inbound, and Dry Fork Ridge inbound. Pacers must check in and out with their runners and wear the runner's official pacer bib."
  terrain_artifacts:
    status: generated
    path: "/terrain/bighorn-100.json"
    generated_on: "2026-07-07"
    source_label: "AWS Terrain Tiles (Mapzen/Tilezen Terrarium DEM)"
    source_url: "https://registry.opendata.aws/terrain-tiles/"
    attribution: "Terrain tiles by Mapzen / Tilezen, from the AWS Open Data Terrain Tiles dataset."
    notes: "Generated by `bin/rails terrain:preprocess[bighorn-100]`."
  blurb: 100 miles out-and-back through Wyoming's Bighorn Mountains, Dayton up to the Jaws turnaround.
  about: >-
    The Bighorn Trail Run 100-miler runs from the Tongue River Canyon near Dayton, WY out to
    the Jaws turnaround (mile 48, 8,800 ft) and back — 20,500 ft of climbing across 76 miles of
    technical single-track, 16 miles of jeep trail and 8 miles of gravel road. Start 9:00 AM;
    35-hour overall cutoff (8:00 PM the next day).
  start_venue: Tongue Canyon Road, Dayton, WY
  finish_venue: Scott Park, Dayton, WY

