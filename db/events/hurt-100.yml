# HURT 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry is an exact copy of the organizer's official HURT100.gpx
# route download; station coordinates come from the organizer's Google My Maps
# course placemarks. Station-pass miles use the organizer's published frame
# (Book of HURT 2027 cutoff table: Mānoa at mile 7 and Nuʻuanu at mile 12.5 of
# each nominal 20-mile lap); the official GPX measures the loop at ~16.8 mi and
# the organizer's map legs at ~18.8 mi. Source decisions are documented in
# docs/research/hurt-100-2027-source-audit.md.

race:
  name: HURT 100
  slug: hurt-100
  year: 2027
  state: HI
  distance_mi: 100
  elevation_gain_ft: 24500 # Book of HURT 2027: cumulative gain per 100 miles.
  elevation_loss_ft: 24500
  start_date: 2027-01-16
  end_date: 2027-01-17
  start_time: 6:00 AM
  time_zone: Pacific/Honolulu
  cutoff_hours: 36 # 6:00 AM Saturday start → 6:00 PM Sunday finish.
  official_url: https://hurt100.com/
  registration_url: https://hurt100.com/book-of-hurt-2027/
  results_url: https://hurt100.com/race-data-and-past-results/
  registration_status: closed # 2027 field set by lottery drawn August 8, 2026.
  lottery: true # Documented lottery with kukui-nut weighting; the organizer's goal is starting 135 runners.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "The organizer's frame is 5 laps of a nominal 20-mile loop; the official HURT100.gpx route measures ~16.8 miles per loop and the organizer's My Maps legs ~18.8 miles — dense-canopy GPS shortening is documented by neither, so pass miles follow the Book of HURT cutoff table. Neither organizer file carries track elevations; the profile and station spot elevations use the altitude values embedded in the organizer's My Maps course legs."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_hurt_home
        label: "HURT100 site home"
        url: "https://hurt100.com/"
        verified_on: "2026-08-13"
      - &source_book
        label: "Book of HURT 2027 (rules, cutoffs, stations, lottery)"
        url: "https://hurt100.com/book-of-hurt-2027/"
        verified_on: "2026-08-13"
      - &source_course_map_page
        label: "Course map page"
        url: "https://hurt100.com/course-map/"
        verified_on: "2026-08-13"
      - &source_official_gpx
        label: "Official HURT100.gpx route download"
        url: "https://hurt100.com/HURT100.gpx"
        verified_on: "2026-08-13"
      - &source_mymaps
        label: "Organizer Google My Maps HURT 100 Course (KML export)"
        url: "https://www.google.com/maps/d/kml?mid=12L8hV6-KuFKDGc26uqvEzbxSJ1_NN2Q&forcekml=1"
        verified_on: "2026-08-13"
      - &source_results
        label: "Race data and past results page"
        url: "https://hurt100.com/race-data-and-past-results/"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Water is listed at all three stations but no source certifies potability. The Book of HURT states aid stations do not provide gels, energy bars, supplements, medications, or typical first-aid items; has_medical is therefore recorded as false at every pass. Aid stations close 15 minutes after their cutoff times. The 2027 lottery was drawn on August 8, 2026; registration for the 2027 race is closed."
    overall_cutoff_label: "6:00 PM January 17, 2027"
    overall_cutoff_notes: "36 hours from the 6:00 AM Saturday start. Intermediate cutoffs: Makiki mile 80 by 11:00 AM Sunday, Mānoa mile 87 by 1:30 PM Sunday, Nuʻuanu mile 92.5 by 3:30 PM Sunday. Aid stations close 15 minutes after cutoff."
    pacer_rule_summary: "Only one pacer may accompany a runner at a time, starting after 60 miles or 5:00 PM Saturday, whichever comes first. Pacers may start only at Mānoa or Makiki — never at Nuʻuanu — must wear the provided bib, and may not enter an aid station ahead of their runner or leave after them."
    drop_bag_summary: "Runners may have personal supplies at any of the three aid stations. Drop bags (max 12x12x18 inches) are delivered to Makiki between 4:45 and 5:45 AM race morning; as stations close, race personnel transfer drop bags from Mānoa and Nuʻuanu back to the Hālau Kū Māna parking lot. Retrieve bags by 6:15 PM Sunday."
  blurb: Five rainforest laps above Honolulu — 24,500 ft of climbing on 99% single track.
  about: >-
    The HURT 100 runs five nominal 20-mile laps through the semi-tropical
    rainforest above Honolulu on Oʻahu — 99% single track with about 24,500 ft
    of cumulative gain, four stream crossings per lap, and three aid stations
    per lap at Makiki, Mānoa, and Nuʻuanu. Start 6:00 AM Saturday at the
    Hawaiʻi Nature Center; 36-hour limit with lap cutoffs from mile 80 onward.
    Entry is by lottery — the organizer's goal is starting 135 runners — with
    an 8-hour trail-work requirement.
  start_venue: Hawaiʻi Nature Center, 2131 Makiki Heights Drive, Honolulu, HI
  finish_venue: Hawaiʻi Nature Center, 2131 Makiki Heights Drive, Honolulu, HI

