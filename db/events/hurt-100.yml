# Station passes: coordinates from the GPX waypoints (`match` = waypoint-name
# substring; waypoints come from the organizer's My Maps placemarks). Miles use
# the Book of HURT frame: Mānoa at mile 7 and Nuʻuanu at mile 12.5 of each
# nominal 20-mile lap. Later loops merge (`<<:`) the Loop 1 passes and override
# what changes.
aid_stations:
  - match: "Makiki Aid Station"
    name: "Start — Makiki (Hawaiʻi Nature Center)"
    direction: "Start"
    mile: 0.0
    elev: 434
    crew: true
    water: true
    pacer: false
    drop: null
    food: true
    med: false
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "Water, electrolyte drinks, carbonated beverages, and hot and cold food. The organizer does not provide gels, energy bars, supplements, medications, or typical first-aid items."
    bathroom: null
    park: "Crews must park only in authorized areas; drop bags are delivered here between 4:45 and 5:45 AM race morning."
    crew_notes: "Crew access is allowed at Makiki at any time, within 100 yards of the station."
    pacer_notes: "Pacing begins after 60 miles or 5:00 PM Saturday, whichever comes first — not at the start."
    road: null
    source_metadata: &official_station_source
      verification_status: warning
      source_label: "Book of HURT 2027"
      source_url: "https://hurt100.com/book-of-hurt-2027/"
      verified_on: "2026-08-13"
      source_notes: "Verified on is the retrieval date, not the material's effective year. Listed water is not certified potable by any source. Pass miles use the Book of HURT cutoff-table frame (Mānoa mile 7, Nuʻuanu mile 12.5 per nominal 20-mile lap); the official GPX route measures ~16.8 miles per loop. Spot elevations are the altitude values in the organizer's My Maps course legs at the points nearest each station placemark. Aid stations close 15 minutes after cutoff times."
