# Jackpot Ultras Long Course 100 — event data (imported by Events::Import via
# db/seeds.rb). Course geometry copies the organizer's CalTopo "Long Course"
# line (USATF-certified at 2.3094 miles per loop, cert NV23003MWC); the 100
# Mile opens with one short loop, then runs 43 full loops at Cornerstone
# Park for the organizer's 100.489-mile total. The
# Friday short-course 100 (85 x 1.17-mile loops, USATF 100 Mile Championship)
# is a separate race noted in prose. Source decisions are documented in
# docs/research/jackpot-2027-source-audit.md.

race:
  name: Jackpot 100
  slug: jackpot-100
  year: 2027
  state: NV
  distance_mi: 100
  elevation_gain_ft: null # The organizer publishes 72 ft per loop and no whole-race total; the per-loop figure lives in source notes.
  elevation_loss_ft: null
  start_date: 2027-02-20
  end_date: 2027-02-21
  start_time: 8:00 AM
  time_zone: America/Los_Angeles
  cutoff_hours: 30 # 8:00 AM Saturday start → 2:00 PM Sunday overall cutoff; a 6:00 AM early start gets 32 hours.
  official_url: https://aravaiparunning.com/jackpot/
  registration_url: https://ultrasignup.com/register.aspx?did=138131
  results_url: https://ultrasignup.com/results_event.aspx?did=138131
  registration_status: open # Online registration closes 2027-02-14; race-day registration opens an hour before each start.
  lottery: false # Direct first-come UltraSignup registration; no lottery in any reviewed source.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "This record covers the Long Course 100 Mile (Saturday 8:00 AM, one short opening loop then 43 USATF-certified 2.3094-mile loops for the organizer's 100.489-mile total, 30-hour cutoff, 32 with the 6:00 AM early start). Jackpot also runs a separate Friday 100 Mile on the certified 1.17078-mile Short Course (85 loops, 48-hour window) that hosts the USATF 100 Mile Road Championship; run100s' single row conflates the two. Pass miles use the certified loop length from the short-loop opening (the first pass falls at 1.18); the organizer's drawn CalTopo line measures 2.35 miles. The organizer publishes 72 ft of gain per loop and a 1,912 ft max elevation but no whole-race total, so gain stays null; the flat profile is the USGS 3DEP spot value (1,903 ft) at the start/finish marker, held constant."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_race_page
        label: "Jackpot Ultras official race page (Aravaipa Running)"
        url: "https://aravaiparunning.com/jackpot/"
        verified_on: "2026-08-13"
      - &source_caltopo
        label: "Organizer CalTopo Long Course map"
        url: "https://caltopo.com/m/T3R0R9M"
        verified_on: "2026-08-13"
      - &source_cert
        label: "USATF course certification, Long Course (NV23003MWC)"
        url: "https://www.aravaiparunning.com/avr/wp-content/uploads/2023/03/NV23003MWC-Jackpot-Ultras-Long-Course.pdf"
        verified_on: "2026-08-13"
      - &source_cert_short
        label: "USATF course certification, Short Course (NV23001JOE)"
        url: "https://www.aravaiparunning.com/avr/wp-content/uploads/2023/03/NV23001JOE-Jackpot-Ultras-PREVERIFIED.pdf"
        verified_on: "2026-08-13"
      - &source_ultrasignup
        label: "2027 UltraSignup listing"
        url: "https://ultrasignup.com/register.aspx?did=138131"
        verified_on: "2026-08-13"
      - &source_live
        label: "Aravaipa live results (Jackpot Ultras 2027)"
        url: "https://live.aravaiparunning.com/#/jackpot_ultras-2027?raceId=301959"
        verified_on: "2026-08-13"
      - &source_usgs
        label: "USGS 3DEP Elevation Point Query Service (spot elevation)"
        url: "https://epqs.nationalmap.gov/v1/json"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. The Main Strip Aid Station at the start/finish operates 24/7 with vegan, vegetarian, and gluten-free options; water is served but never certified potable. First aid kits and an EMT are onsite for the whole race with a medical tent at the start/finish. Pacers on the Long Course may run from sunset to sunrise only, and USATF Championship (Short Course) competitors may not use pacers at all — the allowance is time-based, so no pass records guaranteed pacer pickup. Crew works the marked crew areas beside the loop at Cornerstone Park."
    overall_cutoff_label: "2:00 PM February 21, 2027"
    overall_cutoff_notes: "30 hours from the 8:00 AM Saturday start; runners taking the 6:00 AM early start get 32 hours to the same 2:00 PM Sunday close. No intermediate cutoffs are published for the Long Course."
    pacer_rule_summary: "Long Course runners may use one pacer from sunset to sunrise only; pacers are prohibited for USATF Championship competitors on the Short Course. Because the allowance is time-based, no pass guarantees pacer pickup."
    drop_bag_summary: "No drop-bag service is published; runners pass their own crew area and the Main Strip Aid Station every 2.31-mile loop."
  blurb: A short opening loop, then 43 certified 2.31-mile loops around Cornerstone Park's lake in Henderson, Nevada.
  about: >-
    The Jackpot 100 Long Course opens with one short loop, then runs 43
    USATF-certified 2.3094-mile loops around the lake at Cornerstone Park in
    Henderson, NV — the organizer's 100.489-mile total — with the 24/7 Main
    Strip Aid Station at the start/finish every lap.
    Start 8:00 AM Saturday; 30-hour limit (2:00 PM Sunday) or 32 hours with
    the 6:00 AM early start. A separate Friday 100 on the certified
    1.17-mile Short Course hosts the USATF 100 Mile Championship.
  start_venue: Cornerstone Park, 1600 Wigwam Parkway, Henderson, NV
  finish_venue: Cornerstone Park, 1600 Wigwam Parkway, Henderson, NV

# The certified park loop is flat; the profile is the USGS 3DEP spot value at
# the organizer's start/finish marker, held constant.
elevation_series:
  - [0, 1903]
  - [25, 1903]
  - [50, 1903]
  - [75, 1903]
  - [100, 1903]

# Station passes: every loop crosses the Main Strip Aid Station at the
# start/finish (`match` = the GPX waypoint from the organizer's marker).
# The race opens with the short loop (first pass at 1.18), then steps by the
# USATF-certified 2.3094 miles to the 100.49 finish. Later loops merge
# (`<<:`) the Loop 1 pass and override what changes.
aid_stations:
  - match: "Main Strip Aid Station"
    name: "Start — Main Strip Aid Station"
    direction: "Start"
    mile: 0.0
    elev: 1903
    crew: true
    water: true
    pacer: false
    drop: null
    food: true
    med: true
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "The Main Strip Aid Station runs 24/7 at the start/finish with vegan, vegetarian, and gluten-free options; first aid kits and an EMT are onsite with a medical tent."
    bathroom: null
    park: "Crew areas are marked beside the loop; camping is available at the park per the organizer's map."
    crew_notes: "Crew works the marked crew areas beside the loop and sees their runner every lap."
    pacer_notes: "Long Course pacers may run from sunset to sunrise only; the allowance is time-based, so no pass guarantees pickup."
    road: null
    source_metadata: &official_station_source
      verification_status: warning
      source_label: "Jackpot Ultras official race page"
      source_url: "https://aravaiparunning.com/jackpot/"
      verified_on: "2026-08-13"
      source_notes: "Verified on is the retrieval date, not the material's effective year. Every loop crosses the same start/finish station; the race opens with one short loop (first pass at 1.18) and then runs 43 USATF-certified 2.3094-mile loops (cert NV23003MWC) to the organizer's 100.489-mile total. Water is served but never certified potable; first aid kits and an EMT are onsite with a medical tent at the start/finish. The spot elevation is a USGS 3DEP value at the organizer's start/finish marker; the organizer publishes 72 ft of gain per loop and a 1,912 ft max."
