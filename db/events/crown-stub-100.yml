# Crown Stub 100 — event data (imported by Events::Import via db/seeds.rb).
# The Bivouac Racing Crown Stub pages carry the race facts; the aid chart
# Google Sheet carries the pass table (with two internally conflicted
# Vernonia totals resolved by the chart's own segment chain, the aid page,
# and the course line); the organizer's CalTopo map is the geometry and
# elevation authority. Source decisions are documented in
# docs/research/crown-stub-2027-source-audit.md.

race:
  name: Crown Stub 100
  slug: crown-stub-100
  year: 2027
  state: OR
  distance_mi: 100.2 # The aid chart's cumulative frame; the CalTopo line GPS-measures 98.62.
  elevation_gain_ft: 7000 # "just over 7,000 feet of elevation gain"; no loss figure is published.
  elevation_loss_ft: null
  start_date: 2027-04-24
  end_date: 2027-04-25
  start_time: 12:00 PM
  time_zone: America/Los_Angeles
  cutoff_hours: 32 # "a unique 12:00 PM Saturday start, giving runners a total of 32 hours" — the finish closes 8:00 PM Sunday.
  official_url: https://www.bivouacracing.com/karissawhyracingeventscom
  registration_url: https://ultrasignup.com/register.aspx?eid=17228
  results_url: https://ultrasignup.com/register.aspx?did=131712 # The 2026 listing carries the 2024-2026 results.
  registration_status: open # The 2027 listing sells the 100 and the relay ($197 rising after August 31; closes April 23, 2027).
  lottery: false # Direct UltraSignup registration.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "A crew-friendly 100 from the Hilltop Day Use Area at L.L. Stub Stewart State Park in Buxton, OR, with out-and-backs on the Banks-Vernonia trail system to the Hwy 30 and Banks turnarounds. The 2027 UltraSignup listing pins April 24, 2027 with the 12:00 PM start (run100s' April 3 dating and the onboarding snapshot's 30-hour and 10,000-foot figures — columns the live table no longer displays — are stale; the current pages say 32 hours and just over 7,000 feet). The aid chart's two Vernonia totals print 18 and 58, but the chart's own segment chain (5.1 + 10.9 = 16.0; 49.6 + 11.2 = 60.8), the aid page's drop-bag miles, and the CalTopo line (crossings at 15.8 and 61.0) all give 16.0 and 60.8 — the corrected miles govern those two passes with pass-specific notes. The aid page's Stewarts Gate drop-bag miles (94 and 100.7) also conflict with the chart's 92.3 and 98.2; the line corroborates the chart (crossings at 92.1 and 98.7), so the chart governs there. The Crown Stub page's Register here button still points at the 2025 listing; the current chain runs through the 2026 listing to the 2027 page."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_page
        label: "Crown Stub 100 page on bivouacracing.com"
        url: "https://www.bivouacracing.com/karissawhyracingeventscom"
        verified_on: "2026-08-13"
      - &source_maps_page
        label: "Course Maps/GPX page (CalTopo link, shoe and headlamp tips)"
        url: "https://www.bivouacracing.com/new-page-1"
        verified_on: "2026-08-13"
      - &source_aid_page
        label: "Aid Stations & Crew Access page (stations, crew rules, pacers, drop bags, cutoffs)"
        url: "https://www.bivouacracing.com/new-page-2"
        verified_on: "2026-08-13"
      - &source_chart
        label: "Crown Stub 100 aid stations and crew spreadsheet"
        url: "https://docs.google.com/spreadsheets/d/1nv_Gb56o1HHzEfubp1HNgr9K4k_l0vFQD7CxZ0gQzlE/edit"
        verified_on: "2026-08-13"
      - &source_caltopo
        label: "Organizer CalTopo course map (line and station markers)"
        url: "https://caltopo.com/m/BEDR0FU"
        verified_on: "2026-08-13"
      - &source_us_2027
        label: "UltraSignup 2027 registration page (April 24, 2027; 12:00 PM start; open)"
        url: "https://ultrasignup.com/register.aspx?eid=17228"
        verified_on: "2026-08-13"
      - &source_us_2026
        label: "UltraSignup 2026 listing (April 4, 2026; results)"
        url: "https://ultrasignup.com/register.aspx?did=131712"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. More than 25 crew access locations (the chart lists crew points between stations — Tophill, Beaver Creek, Floeter, Ruley, and Buxton trailheads among them); crews may meet runners at designated points, but runners may never enter or sit inside a vehicle, moving or parked, on pain of disqualification. Drop bags: each runner checks two bags, available six times (Stewarts Gate and Vernonia passes). A headlamp must be on the runner's person upon leaving the Vernonia station per the course tips, which also suggest road shoes from Stewarts Gate onto the rail-trail miles. Official stations carry food, hydration, medical support, and volunteers; the aid page counts four full-service stations while naming two locations (Stewarts Gate and Vernonia, passed six times between them) with burgers, grilled cheese, and quesadillas, and the rest carry typical aid with Skratch Labs hydration and chews. The fastest man and woman are crowned King and Queen of Stub and split the Royal Purse (a 10 percent tax on registrations); a two-person relay shares the day."
    overall_cutoff_label: "8:00 PM April 25, 2027"
    overall_cutoff_notes: "32 hours from the 12:00 PM Saturday start; the finish closes promptly at 8:00 PM Sunday under the park permit. One intermediate cutoff is published: Stewarts Gate (mile 71.7) at 2:00 PM Sunday."
    pacer_rule_summary: "Pacers may join their runner beginning at the Pisgah Aid Station (mile 40.2). Pacers may help with navigation, pacing strategy, motivation, and encouragement, but may not carry gear, nutrition, or equipment for their runner."
    drop_bag_summary: "Each runner may check two drop bags, available a total of six times: the Stewarts Gate passes (5.1, 71.7, 92.3, and 98.2 — the aid page quotes 94 and 100.7 for the last two against the chart and course line) and the Vernonia passes (16.0 and 60.8). Stewarts Gate is the recommended spot for a shoe change; pack a headlamp in the Vernonia bag."
    tracking_note: "No live tracking is published; results post on UltraSignup."
  blurb: A crew-friendly Banks-Vernonia rail-trail 100 from Stub Stewart State Park with out-and-backs to Hwy 30 and Banks.
  about: >-
    The Crown Stub 100 starts at high noon at the Hilltop Day Use Area
    in L.L. Stub Stewart State Park, Buxton, OR, and runs towering
    forest single track and the Banks-Vernonia rail trails with
    out-and-backs to the Hwy 30 and Banks turnarounds. Just over 7,000
    feet of gain, more than 25 crew access points, drop bags six times,
    pacers from mile 40.2, and 32 hours to earn the buckle — with the
    fastest man and woman crowned King and Queen of Stub. The finish
    closes 8:00 PM Sunday, with one hard gate at Stewarts Gate (71.7)
    at 2:00 PM.
  start_venue: Hilltop Day Use Area, L.L. Stub Stewart State Park, Buxton, OR
  finish_venue: Hilltop Day Use Area, L.L. Stub Stewart State Park, Buxton, OR

