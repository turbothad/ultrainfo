        label: "Timeline page (gear check, start time, directions; stale 2025 dates)"
        url: "https://www.thedrift100.com/schedule/"
        verified_on: "2026-08-13"
      - &source_gpx
        label: "Official course GPX download (Google Drive, linked from the course page)"
        url: "https://drive.google.com/file/d/15pjbQ-uvs6j8rOZO3dhF-HLRqoIjV-gf/view"
        verified_on: "2026-08-13"
      - &source_caltopo
        label: "Organizer CalTopo course map"
        url: "https://caltopo.com/m/N564"
        verified_on: "2026-08-13"
      - &source_ultrasignup
        label: "UltraSignup 2027 registration page (March 12, 2027; opens October 1, 2026)"
        url: "https://ultrasignup.com/register.aspx?eid=15694"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. A remote winter wilderness race under Bridger-Teton and Shoshone National Forest permits: qualification is required (list winter, expedition, and race experience on the registration form; Race Directors approve entries and may refuse under-prepared racers on race day without refund). The mandatory gear list (0°F sleeping bag, tent or true bivy, stove with fuel, and more) is required in full, and racers must start and finish with all gear. Racers must check in and out of every aid station; sleeping in aid stations is not allowed, and stations are small (no bikes, skis, or sleds inside). Cutoff enforcement is strict with no exceptions even for gear failure: a racer who misses the first station's cutoff returns to the start, and misses at later stations mean snowmachine evacuation with the $200 drop-out fee — though a racer who turns around at or south of the Strawberry safety shelter on the way in may return to the start/finish under their own power. Evacuation may take hours. Every 100-mile racer must carry a tracking device: the race has partnered with Trackleaders, rentals are encouraged, and personal SPOT or InReach devices are allowed. Start times may be moved back one hour if temperatures are around zero. The course is subject to slight modification before race day."
    overall_cutoff_label: "5:00 PM March 14, 2027"
    overall_cutoff_notes: "The aid table's finish row: Kendall Valley Lodge, Sunday 5 pm, 55 hours. That is 55 true elapsed hours from the Friday 9:00 AM start because the race weekend crosses the March 14, 2027 spring-forward. Leave-by cutoffs are strictly enforced with no exceptions even for gear failure: missing the first station's cutoff sends a racer back to the start, and missing a later one means snowmachine evacuation and the $200 drop-out fee."
    pacer_rule_summary: "No pacers anywhere — the FAQ answers dog, pacer, and personal snow machine with 'Nope, nope and nope.' This is an individual, human-powered race: an entourage 'may cheer you on out on the course,' but non-racers pacing, following, or otherwise assisting a racer is disqualification. Racers may help each other."
    drop_bag_summary: "No drop bags, gear drops, or outside assistance; racers start and finish with all gear. One exception: racers with food allergies or restrictions may leave the organizer a small container of food for the Warm Springs Aid Station (hot food only)."
  blurb: A winter wilderness point-to-point up the Upper Green — run, fat bike, or ski — from the Green River Trailhead to Kendall Valley Lodge.
  about: >-
    The Drift 100 follows snowmachine trails through the Upper Green River
    country of the Wind River Range from the Green River Trailhead to
    Kendall Valley Lodge near Cora, WY, sharing one winter course across
    run, fat bike, and ski divisions. Start 9:00 AM Friday; the course
    closes 5:00 PM Sunday (55 elapsed hours across the daylight-saving
    change) with strict leave-by cutoffs at four manned, heated aid
    stations near miles 25, 50, 67, and 83. Qualification, mandatory
    winter gear, and full self-sufficiency are required — no drop bags,
    no pacers, no outside assistance, and little cell coverage.
  start_venue: Green River Trailhead, near Cora, WY
  finish_venue: Kendall Valley Lodge, near Cora, WY

