# The Drift 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry copies the organizer's official GPX download; pass miles,
# leave-by cutoff clocks, menus, and bathroom flags follow the published aid
# station table on the 100-mile course page; crew, pacer, and drop-bag rules
# follow the course page and FAQ. Source decisions are documented in
# docs/research/the-drift-2027-source-audit.md.

race:
  name: The Drift 100
  slug: the-drift-100
  year: 2027
  state: WY
  distance_mi: 101 # The aid table's cumulative column ends at 101; the course page blurb says 103 miles and the official GPX GPS-measures 103.1.
  elevation_gain_ft: 9000 # Organizer: "over 9,000 ft elevation loss/gain".
  elevation_loss_ft: 9000
  start_date: 2027-03-12
  end_date: 2027-03-14
  start_time: 9:00 AM
  time_zone: America/Denver
  cutoff_hours: 55 # Friday 9:00 AM MST start to the Sunday 5:00 PM MDT course close is 55 elapsed hours — the race weekend crosses the March 14, 2027 spring-forward.
  official_url: https://www.thedrift100.com/
  registration_url: https://ultrasignup.com/register.aspx?eid=15694
  results_url: https://ultrasignup.com/register.aspx?did=131889
  registration_status: not_open # UltraSignup 2027 page: "Registration Opens Thu. Oct 1, 2026 @ 12:00 AM MT".
  lottery: false # Direct UltraSignup registration, but every racer must be approved: the 100 requires a winter/wilderness qualification resume at the Race Directors' discretion.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "A point-to-point winter race (run, fat bike, or ski divisions on one course) from the Green River Trailhead to Kendall Valley Lodge near Cora, WY. Three distance frames disagree: the aid table's cumulative column ends at 101 (governs pass miles), the course page blurb bills 103 miles, and the official GPX GPS-measures 103.1. The aid table's elapsed-hours sub-column conflicts with its own leave-by clocks at two rows: Warm Springs says Saturday 8 pm / 33 hours (the clock is 35 elapsed hours from the Friday 9 am start) and the second Strawberry pass says Sunday 4 am / 41 hours (the clock is 42 true elapsed hours across the March 14 spring-forward); the posted clocks govern and the pass rows record clock-derived elapsed minutes. The finish row's Sunday 5 pm / 55 hours pair is self-consistent because of the DST change. The site's TIMELINE page still carries the 2025 race's weekday-date pairs (Friday March 14th) and the home page still says registration opens 11/01/24; the 2027 masthead and the UltraSignup 2027 page (March 12, 2027) govern the date. The course page's own Section 1 narrative still tells racers 'Remember you have 48 hours' — matching run100s' stale 48 — but the aid table's leave-by clocks and the timeline's Sunday 5:00 PM close say 55; the table governs and 48 was not copied."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
