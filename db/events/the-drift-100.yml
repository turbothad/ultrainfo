# Station passes: coordinates from the official GPX download's waypoints
# (`match` = waypoint-name substring); spot elevations are USGS 3DEP values
# at those coordinates. Miles, leave-by cutoff clocks, menus, and bathroom
# flags follow the course page's aid table; crew, pacer, and drop-bag rules
# follow the course page and FAQ. Mid-race passes are unlabeled: the course
# is a point-to-point whose upper loop passes Strawberry twice.
aid_stations:
  - match: "Start"
    name: "Start — Green River Trailhead"
    direction: "Start"
    mile: 0.0
    elev: 7660
    crew: false
    water: null
    pacer: false
    drop: null
    food: false
    med: null
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "No aid at the start — the aid table's menu column reads NA. The four manned, heated aid stations are near miles 25, 50, 67, and 83."
    bathroom: null
    park: "Cross the cattle guard, go through the first parking lot, and park in the second parking lot; the organizer asks racers to park efficiently."
    crew_notes: "Outside assistance is not allowed anywhere on the course; an entourage 'may cheer you on out on the course,' but non-racers assisting a racer is disqualification."
    pacer_notes: "No pacers — an individual, human-powered race; racers may only accept help from other racers."
    road: "From Pinedale: north on US 191 about 5.5 miles, then right on Highway 352 toward Cora for about 25 miles."
    source_metadata: &official_station_source
      verification_status: warning
      source_label: "The Drift 100 course page aid table"
      source_url: "https://www.thedrift100.com/100-mile-course/"
      verified_on: "2026-08-13"
      source_notes: "Verified on is the retrieval date, not the material's effective year. Every pass mile, leave-by clock, menu, and bathroom flag comes from the aid table on the 100-mile course page; crew and pacer rules come from the FAQ's outside-assistance ban; drop-bag rules come from the course page and gear rules. The table's elapsed-hours sub-column disagrees with its own clocks at Warm Springs (33 hours printed against a 35-hour clock) and the second Strawberry pass (41 printed against 42 true elapsed hours across the March 14 spring-forward); the posted clocks govern and elapsed minutes are clock-derived. Station coordinates are the official GPX download's waypoints; elevations are USGS 3DEP spot values at those coordinates. Aid stations serve hot menu items plus sweet and salty snacks, coffee, tea, and water with the ability to heat it; potability is never certified and no medical service is published, though racers who miss cutoffs are evacuated by snowmachine."
      sources:
        - *source_course
        - *source_faq
        - *source_gear
        - *source_schedule
        - *source_gpx
        - *source_ultrasignup
