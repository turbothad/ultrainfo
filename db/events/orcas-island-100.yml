# Orcas Island 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry, elevations, and the four station waypoints copy the
# organizer's official GPX download; pass miles use the organizer's nominal
# 25-mile loop frame, which their own last-lap cutoff miles (75/80/90/95/100)
# confirm. Source decisions are documented in
# docs/research/orcas-island-2027-source-audit.md.

race:
  name: Orcas Island 100
  slug: orcas-island-100
  year: 2027
  state: WA
  distance_mi: 100
  elevation_gain_ft: 26000 # Organizer: ~26,000 ft; the official GPX sums to ~26,600 over four loops.
  elevation_loss_ft: 26000
  start_date: 2027-02-26
  end_date: 2027-02-27
  start_time: 8:00 AM
  time_zone: America/Los_Angeles
  cutoff_hours: 36 # 8:00 AM Friday start → 8:00 PM Saturday, with last-lap station cutoffs from mile 75.
  official_url: https://www.rainshadowrunning.com/orcas100.html
  registration_url: https://www.webscorer.com/register?pid=1&raceid=423395
  results_url: https://chronokeep.com/results/orcas-island-100m
  registration_status: open # "Register Now for 2027" live at verification; early-bird pricing before April 1.
  lottery: false # Direct registration on Webscorer; Rainshadow's lottery system applies to other races, not this one at verification.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "The organizer bills four 25-mile loops and a 100.8-mile total and quotes last-lap cutoffs at miles 75/80/90/95/100, so pass miles use the nominal 25-mile frame; the official GPX (embedded name `2026 Orcas 100`, revised 2.23) GPS-measures the loop at 24.0 miles and is used for geometry, station coordinates, and elevations. The 2026-revision GPX is the current download on the 2027 page. A runner who leaves the final aid station by its cutoff earns an official finish even after the 8:00 PM close."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_race_page
        label: "Orcas Island 100 official page (Rainshadow Running)"
        url: "https://www.rainshadowrunning.com/orcas100.html"
        verified_on: "2026-08-13"
      - &source_gpx
        label: "Official course GPX download (2026 Orcas 100, revised 2.23)"
        url: "https://www.rainshadowrunning.com/uploads/2/6/1/4/26141050/2026_orcas_100__revised_2.23_.gpx"
        verified_on: "2026-08-13"
      - &source_course_doc
        label: "Course description document (Google Doc)"
        url: "https://docs.google.com/document/d/1psSza3f-xV_Nsope3KfCoFYUVDOdupAW2mV05w6M_pg/edit?usp=sharing"
        verified_on: "2026-08-13"
      - &source_caltopo
        label: "Organizer CalTopo course map"
        url: "https://caltopo.com/m/1QAU0"
        verified_on: "2026-08-13"
      - &source_camp_moran_doc
        label: "Camp Moran aid station and start/finish directions (Google Doc)"
        url: "https://docs.google.com/document/d/1sg6qIkXcfaSKz6KFTbZtdIt_j9jtqtiBcQmFsGKHCZo/edit?usp=sharing"
        verified_on: "2026-08-13"
      - &source_registration
        label: "2027 Webscorer registration"
        url: "https://www.webscorer.com/register?pid=1&raceid=423395"
        verified_on: "2026-08-13"
      - &source_results
        label: "Chronokeep results (Orcas Island 100M)"
        url: "https://chronokeep.com/results/orcas-island-100m"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Every station serves full aid but no source certifies water potability and no medical service is published. Runners who climb the Mt Constitution tower on all four loops and punch their bib at the top join the Tower Club. Getting to Orcas Island requires a Washington State Ferries reservation; crews display a Discover Pass to park in Moran State Park. The race is on the traditional lands of the Lhaq'temish and Samish Peoples, as the organizer notes."
    overall_cutoff_label: "8:00 PM February 27, 2027"
    overall_cutoff_notes: "36 hours from the 8:00 AM Friday start, with last-lap cutoffs: Camp Moran mile 75 by 11:00 AM Saturday, Mountain Lake mile 80 by 12:45 PM, Cascade Lake mile 90 by 4:00 PM, Mt Constitution mile 95 by 6:15 PM, and the finish at 8:00 PM — though a runner out of the last aid station by its cutoff earns an official finish even after 8:00 PM."
    pacer_rule_summary: "Pacers are allowed for all runners from mile 25 — none on the first lap. They start from any crew-accessible station (Camp Moran, Mountain Lake, or Cascade Lake after lap 1; Mt Constitution on the last lap only), must register and collect a pacer bib at Camp Moran, and may not mule — runners may take things from pacers or crew only at aid stations."
    drop_bag_summary: "Drop bags are handed in at Thursday bib pickup at Camp Moran; Mountain Lake bags are due by 7:30 AM Friday and the other stations' bags by 8:00 AM."
  blurb: Four 25-mile Moran State Park loops with 26,000 ft of climbing above the Salish Sea.
  about: >-
    The Orcas Island 100 runs four 25-mile loops of Moran State Park from
    Camp Moran near Olga, WA — old-growth forest, mountain lakes, Cascade
    Falls, the Powerline climbs, and the Mt Constitution summit tower on
    every lap for aspiring Tower Club members — roughly 26,000 ft of gain in
    all. Start 8:00 AM Friday; 36-hour limit with last-lap cutoffs from mile
    75, finishing at 8:00 PM Saturday. Reaching the island takes a ferry
    reservation through the San Juans.
  start_venue: Camp Moran, Moran State Park, Olga, WA
  finish_venue: Camp Moran, Moran State Park, Olga, WA

