# out-and-back base water is served at 19.0 and 22.1, and West Fork at
# 36.2 and 78.8), and the Finish at Mink Creek Group Site. Table miles
# govern (the Event Info prose and crew page print two other frames,
# documented per pass). Old Tom Summit is the one Turnaround - the
# official GPX's out-and-back waypoint at the spur apex. Coordinates
