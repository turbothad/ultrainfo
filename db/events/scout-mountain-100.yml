# Scout Mountain 100 — event data (imported by Events::Import via
# db/seeds.rb). The scoutmountainultras.com home page banners the 2027
# return ("See you again on the first weekend in june 2027!"); the
# Event Info page carries the start lines, the aid-table link, planned
# foods, and the pacer and drop-bag rules; the linked Google Sheets aid
# table governs miles, crew/drop/pacer flags, and the cutoff ladder;
# the official 100M GPX (with altitudes) is the geometry and elevation
# authority. Source decisions are documented in
# docs/research/scout-mountain-2027-source-audit.md.

race:
  name: Scout Mountain 100
  slug: scout-mountain-100
  year: 2027
  state: ID
  distance_mi: 102.7 # The aid table's 100M column ends at 102.7; the official GPX GPS-measures 102.37.
  elevation_gain_ft: 22000 # The Race section prints "~22,000 feet of vertical gain (and loss)"; the aid table's segment climbs sum to 21,430 (run100s' 23,800 has no counterpart).
  elevation_loss_ft: 22000 # The same "~22,000" print; the table's segment descents sum to 21,453.
  start_date: 2027-06-04
  end_date: 2027-06-05
  start_time: 10:00 AM
  time_zone: America/Boise
  cutoff_hours: 36 # The 100M starts 10:00 AM Friday and the aid table's finish clock is 10:00 PM Saturday.
  official_url: https://scoutmountainultras.com
  registration_url: https://runsignup.com/Race/ID/Pocatello/ScoutMountainUltras
  results_url: https://runsignup.com/Race/Results/Overview/121614 # RunSignup hosts the results.
  registration_status: not_open # The RunSignup race page still carries the June 5-6, 2026 frame; 2027 registration is not yet posted.
  lottery: false # Direct RunSignup registration; half the field is held for women/femme/non-binary runners.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "The Scout Mountain Ultras 100M near Pocatello, ID: point to point from Lead Draw Trailhead to Mink Creek Group Site & Campground, 102.7 miles with an out-and-back over Old Tom Summit (about 8,630 feet). The home page banners the 2027 return on the first weekend in June, and the 100M starts 10:00 AM Friday - June 4, 2027 - with the aid table's finish clock at 10:00 PM Saturday (36 hours). The Google Sheets aid table linked from Event Info governs station miles, the crew/drop-bag/pacer columns, and the ten-clock cutoff ladder. Two other mile frames exist and the table governs both: the Event Info drop-bag and pacer prose prints 15.68/29.4/36.39/48.54/61.33/79.03/85.40/96.25 for the table's 15.7/29.2/36.2/48.4/61.1/78.8/85.2/96.1, and the crew page prints Gibson Jack at mile 47.8. The Race section prints ~22,000 feet of gain and loss (the table's segments sum to 21,430/21,453; run100s' 23,800 has no counterpart). The official 100M GPX carries the full line with altitudes (46,134 points, GPS 102.37 scaled to the table's 102.7) and station waypoints, including the Old Tom out-and-back marker at the summit; its start altitude matches the table's printed 5,179-foot segment floor. The RunSignup race page still shows the June 5-6, 2026 frame, so 2027 registration is recorded not yet open."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
        verified_on: "2026-08-14"
      sources:
        verified_on: "2026-08-14"
    sources:
      - &source_home
        label: "scoutmountainultras.com home (the 2027 first-weekend-in-June banner; tracking posts land here)"
        url: "https://scoutmountainultras.com"
        verified_on: "2026-08-14"
      - &source_event
        label: "Event Info page (start lines, the aid-table link, planned foods, pacer and drop-bag rules, mandatory kit)"
        url: "https://scoutmountainultras.com/event-info"
        verified_on: "2026-08-14"
      - &source_sheet
        label: "Aid Station Info sheet (miles, crew/drop-bag/pacer columns, the cutoff ladder, segment climb figures)"
        url: "https://docs.google.com/spreadsheets/d/1yVTdR4Rsr1NqwwZUic_BHCWTNbocpIxI"
        verified_on: "2026-08-14"
      - &source_general
        label: "General Info page (The Race's ~22,000-foot print, runner tracking, the drop-out rule)"
        url: "https://scoutmountainultras.com/general-info"
        verified_on: "2026-08-14"
      - &source_crew
        label: "Crew page (the six crew stations, vehicle tags, shuttles, lot coordinates, the 47.8 Gibson Jack print)"
        url: "https://scoutmountainultras.com/crew"
        verified_on: "2026-08-14"
      - &source_gpx
        label: "Official 100M GPX (the full line with altitudes and station waypoints, linked from GPX Overview)"
        url: "https://scoutmountainultras.com/s/SMU-100M.gpx"
        verified_on: "2026-08-14"
      - &source_reg
        label: "RunSignup race page (registration home and results host; still on the June 5-6, 2026 frame)"
        url: "https://runsignup.com/Race/ID/Pocatello/ScoutMountainUltras"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. Half the field is held for women/femme/non-binary runners. Mandatory kit: a mylar blanket and whistle for everyone, and 100M runners must carry the course map on a phone or watch (shown at bib pickup); poles are allowed. The course is marked with pink webbing, pin flags, directional signs, and reflective markers at night. Dropping out is only allowed at an aid station with the captain's confirmation - leaving the course otherwise triggers search and rescue. Every aid station stocks ice and GU Energy products; caffeinated and non-caffeinated Roctane flow from West Fork onward, and only non-caffeinated Roctane sits at Walker Creek, Goodenough, and South Fork. Timing chips must come back at the finish ($100 otherwise). Cell service is unlikely at the finish area and West Fork; Starlink at aid stations is limited to runsignup.com and scoutmountainultras.com. Swag is a custom item such as buffs, sleeves, or hats rather than a shirt."
    overall_cutoff_label: "10:00 PM June 5, 2027"
    overall_cutoff_notes: "36 hours from the Friday 10:00 AM start. The aid table prints a ten-clock ladder: Walker Creek 12:00 PM and Goodenough 3:00 PM Friday, South Fork 7:15 PM, West Fork 9:00 PM, then Gibson Jack 12:45 AM, City Creek 5:45 AM, West Fork 12:45 PM, Scout Mountain 3:30 PM, Big Fir 8:00 PM, and the finish 10:00 PM Saturday."
    pacer_rule_summary: "Pacers are for 100-milers only and may start or finish at the aid table's six marked stations: West Fork (both passes), Gibson Jack, City Creek, Scout Mountain, and Big Fir. Each pacer signs a waiver and wears a pacer bib; the Big Fir pacer exchange sits a quarter mile from the aid station on the dirt road."
    drop_bag_summary: "Drop bags check in at the pre-race briefing and should be weatherproof. The aid table marks seven bag stations: Goodenough, South Fork, West Fork (both passes), Gibson Jack, City Creek, and Big Fir. All bags are transported to the finish afterward - Big Fir bags arrive late, after the last shuttle - and unclaimed bags go to Goodwill the following Friday."
    tracking_note: "Chip timing registers arrival at every aid station except Cusick Creek and at the finish, and tracking information posts on the scoutmountainultras.com homepage when available; results post on RunSignup."
  blurb: 102.7 point-to-point miles near Pocatello with an out-and-back over Old Tom Summit, about 22,000 feet of climb, and 36 hours from the Friday 10:00 AM start.
  about: >-
    The Scout Mountain 100 runs 102.7 miles point to point through the
    mountains around Pocatello, Idaho - from Lead Draw Trailhead over
    an out-and-back to Old Tom Summit near 8,630 feet, across Scout
    Mountain late, and down to the Mink Creek Group Site finish with
    about 22,000 feet of gain and loss. The aid table prints a
    ten-clock cutoff ladder inside the 36-hour window, crews work six
    tag-controlled stations plus the finish shuttles, pacers join at
    the table's six marked stations, and chip timing registers arrival
    at nearly every aid station.
  start_venue: Lead Draw Trailhead, Pocatello, ID
  finish_venue: Mink Creek Group Site & Campground, Pocatello, ID

