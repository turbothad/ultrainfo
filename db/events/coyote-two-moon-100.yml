        url: "https://ultrasignup.com/register.aspx?did=139136"
        verified_on: "2026-08-14"
      - &source_turnbyturn
        label: "100-miler page (turn-by-turn pass miles, station elevations, summit bracelets)"
        url: "https://www.coyote2moon.com/turn-by-turn-directions"
        verified_on: "2026-08-14"
      - &source_runners
        label: "Runners page (aid stocking, pacer and drop-bag rules, the 100M Topo map link)"
        url: "https://www.coyote2moon.com/general-1"
        verified_on: "2026-08-14"
      - &source_caltopo
        label: "Organizer CalTopo course map (the 100M line and station markers)"
        url: "https://caltopo.com/m/2D1CJ"
        verified_on: "2026-08-14"
      - &source_epqs
        label: "USGS 3DEP point elevation service (profile series; the CalTopo line carries no elevations)"
        url: "https://epqs.nationalmap.gov/v1/json"
        verified_on: "2026-08-14"
      - &source_us_2026
        label: "UltraSignup 2026 listing (results; the Runners page's SIGN UP target)"
        url: "https://ultrasignup.com/register.aspx?did=127423"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. Runners collect four summit bracelets: TopaTopa Bluff (8.2 and 90.73), Chief Peak (42.5), and the Nordhoff Peak fire tower (about 64.8, climbed once). Manned stations stock Neversecond gels and C30 drink, GU gels and blocks, PB&J, quesadillas, soups, candy, and cookies; the unmanned Chief Peak stop is water only. The 100M qualifier is a trail 100K with at least 10,000 feet of gain completed within one year (proof emailed to the organizers). No refunds or transfers; deferral only at the Race Director's discretion. The Strava and HelloDrifter maps are login-walled and the 100-page's CalTopo button has an empty href — the Runners page's 100M Topo map link is the open geometry surface. Ojai's Sisar Canyon Run Club hosts Sunday runs from the same school."
    overall_cutoff_label: "11:00 AM May 2, 2027"
    overall_cutoff_notes: "42 hours from the Friday 5:00 PM start — 11:00 AM Sunday. No station-level cutoff ladder is published for the 100M."
    pacer_rule_summary: "One pacer total — 'One pacer. Uno. Singular.' — joining at the Gridley trailhead (Gridley Bottom, 57.91) or the Cozy Dell trailhead (71.54). Email the pacer's name, join point, phone number, and an emergency contact in advance; the pacer signs a waiver."
    drop_bag_summary: "Four 100M drop-bag locations: Rose Valley (passed at 17.56 and 46.86), Horn Canyon (serving the Thacher Creek Trailhead station at 34.90), Gridley Bottom (57.91), and Cozy Dell (71.54). Bags to runner check-in before 4:00 PM Friday, labeled with bib number and station; no valuables; returns Sunday afternoon."
    tracking_note: "No live tracking is published; results post on UltraSignup."
  blurb: A moonlit Ojai front-country 100 with five TopaTopa passes, four summit bracelets, and 42 hours from the Friday 5:00 PM start.
  about: >-
    Coyote Two Moon starts at 5:00 PM on Friday so runners catch
    sunset from the TopaTopa bluffs — then spend the night and the
    next day collecting summit bracelets across Ojai's front country:
    TopaTopa Bluff twice, Chief Peak, and the Nordhoff fire tower,
    with long fire-road climbs, technical single track, and 26,000
    feet of gain over 100.23 miles. Full-service stations at seven
    spots (the Chief Peak stop is water only), one pacer from Gridley
    or Cozy Dell, drop bags at four stations, and 42 hours to the
    buckle back at the Rock Tree Sky school.
  start_venue: Rock Tree Sky school, Sisar Road, upper Ojai, CA
  finish_venue: Rock Tree Sky school, Sisar Road, upper Ojai, CA

