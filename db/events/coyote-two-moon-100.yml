# Coyote Two Moon 100 — event data (imported by Events::Import via
# db/seeds.rb). The 2027 UltraSignup listing carries the current dates,
# start, cutoff, cap, and qualifier; the 100-miler page's turn-by-turn
# carries the pass miles and station elevations (with paired
# header/body mile conflicts arbitrated by the organizer CalTopo line);
# the Runners page carries aid, pacer, and drop-bag rules; USGS 3DEP
# point elevations supply the profile because the CalTopo line is
# two-dimensional. Source decisions are documented in
# docs/research/coyote-two-moon-2027-source-audit.md.

race:
  name: Coyote Two Moon 100
  slug: coyote-two-moon-100
  year: 2027
  state: CA
  distance_mi: 100.23 # The turn-by-turn's finish print ("Rock Tree Sky School 100.23mi"); the CalTopo line GPS-measures 100.52.
  elevation_gain_ft: 26000 # The 2027 listing: "100 milers: 26,000 ft. of climbing"; the 100-page prints 26,393. No loss figure is published.
  elevation_loss_ft: null
  start_date: 2027-04-30
  end_date: 2027-05-02
  start_time: 5:00 PM
  time_zone: America/Los_Angeles
  cutoff_hours: 42 # "100 mi and 100k have 42 hours" — the finish closes 11:00 AM Sunday, May 2.
  official_url: https://www.coyote2moon.com/turn-by-turn-directions
  registration_url: https://ultrasignup.com/register.aspx?did=139136
  results_url: https://ultrasignup.com/register.aspx?did=127423 # The 2026 listing carries the results tabs.
  registration_status: open # The 2027 listing sells all six distances (closes April 28, 2027; 200 spots across the weekend).
  lottery: false # Direct registration with a qualifier (a trail 100K with 10,000 feet of gain within one year for the 100M).
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "A moonlit out-and-back web over Ojai's front country from the Rock Tree Sky school on Sisar Road: five TopaTopa passes with four summit bracelets (TopaTopa Bluff twice, Chief Peak, the Nordhoff fire tower), Rose Valley, Thacher Creek, the Gridley trail, and Cozy Dell. The 2027 UltraSignup listing is fully 2027-frame (Friday, April 30, 2027 at 1700; 42 hours; 200 spots; open) while run100s' May 21-22 dates and 40-hour cutoff have no counterpart and the Runners page's start-times table still prints 2025/2026 frames. The turn-by-turn's section headers and body prints disagree on six pass miles by 0.16-0.45; the organizer CalTopo line arbitrates each pair (10.76, 23.77, 52.24, 63.36, 71.54, 93.20 govern) and its own header refutes the stray Gridley Bottom 63.44 print (57.91 governs, line crossing 57.80). Aid-station numbering is chaotic on the page (Cozy Dell is both eight and six); the CalTopo markers' numbering governs naming. No crew provisions are published anywhere — crew is recorded false with notes. The listing's Sunday header prints May 3rd against its own April 30 - May 2 title."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
