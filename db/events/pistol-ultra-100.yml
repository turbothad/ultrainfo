# Station passes: three physical stations produce five passes per 10-mile
# loop (Woody's at ~1.9 and ~8.1, Lucky's at ~4 and ~6.1, the Long Run
# Store station at the loop start/finish); the 100 runs ten loops.
# Coordinates and elevations sit on the official Imperial GPX at each
# station's first loop mile (`match` = waypoint-name substring). Only the
# finish carries a published cutoff.
aid_stations:
  - match: "Long Run Store Aid Station Start/Finish"
    name: "Start — Springbrook Pool (Long Run Store Aid Station)"
    direction: "Start"
    mile: 0.0
    elev: 850
    crew: true
    water: true
    pacer: true
    drop: null
    food: true
    med: null
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "The Long Run Store Aid Station at the Springbrook Pool start/finish: fully stocked, with warming areas for runners."
    bathroom: "Restrooms at Springbrook Pool and porta-potties near the start/finish."
    park: "100 Mile runners park at Springbrook Pool; others are assigned to nearby school and church lots."
    crew_notes: "The runner self-support canopy area sits near the start/finish, and runners may set up their own support crew area along the course; aid stations themselves are exclusively for registered runners, active pacers, and race volunteers."
    pacer_notes: "Pacing is allowed from the start: one foot pacer per runner during daylight hours on Saturday; bicycle pacers wait for Saturday night."
    road: null
    source_metadata: &official_station_source
      verification_status: warning
      source_label: "The Pistol Course Route page aid stations"
      source_url: "https://www.pistolultra.com/Race/ThePistolCreekRun/Page/Course-Route"
      verified_on: "2026-08-13"
      source_notes: "Verified on is the retrieval date, not the material's effective year. Station names and approximate loop miles (1.9, 4, 6.1, 8.1 and the start/finish) come from the Course Route page; crew exclusions, the canopy area, restrooms, and pacer rules come from the Course Route, FAQ, Runners-Info, and Pacers pages. No intermediate cutoffs are published — only the finish carries the 32-hour clock, and staff may pull a runner who cannot finish the current or final lap in time. Woody's carries no stocking descriptor of its own; its food and water rest on the Runners-Info page's blanket Fully-Stocked Aid Stations claim. Station coordinates and elevations sit on the official Imperial GPX at each station's first loop mile; Woody's second pass (8.1) runs 317 feet from the first and Lucky's second pass (6.1) runs 525 feet from the first across the greenway. No drop-bag service or medical service is published."
      sources:
        - *source_course
        - *source_faq
        - *source_runners_info
        - *source_pacers
        - *source_events
