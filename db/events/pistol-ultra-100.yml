# The Pistol Ultra 100 — event data (imported by Events::Import via db/seeds.rb).
# The race's RunSignup-hosted site (pistolultra.com) is the primary source:
# the Events listing for dates, starts, and registration; the Course Route
# page for the Imperial loop, its stations, and the official GPX; the FAQ
# for cutoffs and the self-support canopy area; the Pacers page for
# pacer rules. Source decisions are documented in
# docs/research/pistol-ultra-2027-source-audit.md.

race:
  name: The Pistol Ultra 100
  slug: pistol-ultra-100
  year: 2027
  state: TN
  distance_mi: 100 # Ten 10-mile Imperial loops; the official GPX GPS-measures the loop at 10.17.
  elevation_gain_ft: null # No organizer figure; run100s' 1,350 was not copied.
  elevation_loss_ft: null
  start_date: 2027-03-13
  end_date: 2027-03-14
  start_time: 8:00 AM
  time_zone: America/New_York
  cutoff_hours: 32 # 8:00 AM EST Saturday to 5:00 PM EDT Sunday is 32 elapsed hours — the race crosses the March 14, 2027 spring-forward.
  official_url: https://www.pistolultra.com/
  registration_url: https://www.pistolultra.com/Race/Events/TN/Alcoa/ThePistolCreekRun
  results_url: https://www.pistolultra.com/Race/Results/Overview/55312
  registration_status: open # The 100 Mile listing sells with 67 spots left; registration opened July 11, 2026.
  lottery: false # Direct RunSignup registration.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "Year 14 of a loop race at Springbrook Pool in Alcoa, TN: the 100 Mile runs ten 10-mile Imperial loops on the lit, paved Pistol Creek greenway (the Metric 10.35-mile loop serves the 100K/50K). Three surfaces state the finish differently: the FAQ's cutoff table says 32 hours for the 50K/100K/100 Mile and that the course officially closes at 32 hours, the Events listing ends the 100 Mile at 5:00 PM EDT Sunday (32 true elapsed hours from the 8:00 AM EST Saturday start across the March 14 spring-forward), and the Schedule page's 4:00 PM Course Closes line matches the Sunday 10/20-mile races' 8-hour window; the FAQ and listing govern and 32 is recorded. Aid stations and warming areas are exclusively for registered runners, active pacers, and race volunteers, so the two mid-loop stations record crew false while the start/finish hub (with the runner canopy area) records crew true. The course page gives Woody's no stocking descriptor; food and water there rest on the Runners-Info page's blanket Fully-Stocked Aid Stations claim. run100s' 30-hour cutoff has no counterpart on the current site (the FAQ says 32)."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_home
        label: "The Pistol site home (pistolultra.com)"
        url: "https://www.pistolultra.com/"
        verified_on: "2026-08-13"
      - &source_events
        label: "Events listing (dates, start and end times, registration windows)"
        url: "https://www.pistolultra.com/Race/Events/TN/Alcoa/ThePistolCreekRun"
        verified_on: "2026-08-13"
      - &source_course
        label: "Course Route page (Imperial loop, stations, official GPX links)"
        url: "https://www.pistolultra.com/Race/ThePistolCreekRun/Page/Course-Route"
        verified_on: "2026-08-13"
      - &source_runners_info
        label: "Runners Info page (32-hour prose, course overview, crew area)"
        url: "https://www.pistolultra.com/Race/ThePistolCreekRun/Page/Runners-Info"
        verified_on: "2026-08-13"
      - &source_schedule
        label: "Schedule and packet pickup page"
        url: "https://www.pistolultra.com/Race/ThePistolCreekRun/Page/Schedule-Packet-Pickup"
        verified_on: "2026-08-13"
      - &source_faq
        label: "FAQ (cutoffs, venue, restrooms, canopy area, parking)"
        url: "https://www.pistolultra.com/Race/ThePistolCreekRun/Page/FAQ"
        verified_on: "2026-08-13"
      - &source_pacers
        label: "Pacers page (personal, bicycle, and volunteer pacer rules)"
        url: "https://www.pistolultra.com/Race/ThePistolCreekRun/Page/Pacers"
        verified_on: "2026-08-13"
      - &source_gpx
        label: "Official Imperial course GPX download (Google Drive, linked from the course page)"
        url: "https://drive.google.com/file/d/16ONPOuUtiPtydGeoc-NZzjH_yP481cvR/view"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. A USATF-certified, flat, lit greenway course with restrooms at Springbrook Pool and porta-potties near the start/finish and on the course. Race staff or medical personnel may remove a runner judged unable to complete the current or final lap in time. A designated runner self-support area near the start/finish takes one 10-by-10-foot canopy per registered runner (setup from noon Friday; no generators, outlets, ground stakes, or camping tents). Parking for the 100 Mile is at Springbrook Pool. Packet pickup is Friday 2:00-6:00 PM at the Hilton Knoxville Airport with late pickup 6:30-7:30 AM Saturday; the 100K and 100 Mile start together at 8:00 AM after the 7:55 AM 50K start. No alcohol anywhere on the grounds or course; no dogs or pets. Finishers earn a custom belt buckle, with sub-24-hour and other awards listed on the site."
    overall_cutoff_label: "5:00 PM March 14, 2027"
    overall_cutoff_notes: "The FAQ's cutoff table gives the 100 Mile 32 hours and says the course officially closes at 32 hours; the Events listing ends the race at 5:00 PM EDT Sunday, which is 32 true elapsed hours from the 8:00 AM EST Saturday start across the March 14, 2027 spring-forward. The Schedule page's Sunday 4:00 PM Course Closes line matches the 10/20-mile races' 8-hour window instead. No intermediate cutoffs are published, but staff may pull a runner who cannot finish the current or final lap in time."
    pacer_rule_summary: "Three pacer types: personal pacers (free registration, waiver, and a numbered pacer bib from packet pickup; one bib per runner, transferred between pacers; no limit on how many pacers a runner uses), bicycle pacers (not permitted during daylight hours on Saturday, when only one foot pacer is allowed per runner; from Saturday night through Sunday a runner without a foot pacer may use one bicycle pacer, with lights), and official volunteer pacers staged at the main aid station in hourly shifts from 9:00 PM Saturday to 10:00 AM Sunday. Pacers provide encouragement only — no muling."
    drop_bag_summary: "No drop-bag service is published. Runners self-support from the designated canopy area near the start/finish: one 10-by-10-foot canopy per registered runner, setup from noon Friday, no generators, outlets, ground stakes, or camping tents."
    tracking_note: "No live tracking is published; results post on the site's RunSignup results page."
  blurb: Ten laps of a lit, paved 10-mile greenway loop along Pistol Creek from Springbrook Pool in Alcoa.
  about: >-
    The Pistol Ultra runs year 14 at Springbrook Pool in Alcoa, TN, where
    the 100 Mile covers ten laps of the 10-mile Imperial loop on the
    paved, night-lit Pistol Creek greenway. Start 8:00 AM Saturday with
    a 32-hour limit (5:00 PM Sunday across the daylight-saving change).
    Three stations serve five aid passes per lap, runners self-support
    from a canopy area at the start/finish hub, and pacers — on foot by
    day, foot or bicycle overnight — may join throughout. Flat, fast,
    USATF-certified, and famously festive.
  start_venue: Springbrook Pool, 636 Vose Road, Alcoa, TN
  finish_venue: Springbrook Pool, 636 Vose Road, Alcoa, TN

