        url: "https://caltopo.com/m/F0KV9AL"
        verified_on: "2026-08-14"
      - &source_results
        label: "UltraSignup results (the completed 2026 running and earlier results)"
        url: "https://ultrasignup.com/results_event.aspx?did=128016"
        verified_on: "2026-08-14"
    notes: "Checked against first-party and organizer-linked sources on August 14, 2026. Registration is open at $350 before fees and closes June 11, 2027 at 11:59 PM PT; no capacity or lottery is published. The guide supplies snacks, Hammer gels, and electrolytes at aid stations, with hot food at Tamarack, Cypress, both Base passes, Goose Valley, and Black Ranch. Bags are staged at the Guest Ranch Thursday from 4:00-7:00 PM. Required gear includes a headlamp, backup light, emergency blanket, whistle, warm layer, gloves, beanie, water capacity, and calories. No live-tracking surface is published. Recheck the whole course bundle in race week when the organizer selects Course A, B, C, or D and confirms whether the conditional Magee operation exists."
    overall_cutoff_label: "8:30 PM June 19, 2027"
    overall_cutoff_notes: "40 hours from the Friday 4:30 AM start. The guide prints eight clocks: Tamarack 7:00 PM Friday; Cypress 2:00 AM, Base first pass 4:30 AM, Summit 9:00 AM, Base second pass 11:30 AM, Goose Valley 3:00 PM, Black Ranch 5:00 PM, and the finish 8:30 PM Saturday. Arrival-versus-departure semantics are not published."
    pacer_rule_summary: "Up to four pacers are allowed, one at a time. The first may join at Base of Burney Mountain at mile 55; pickup or exchange is available there on both passes, at Goose Valley, and at Black Ranch. Pacers check in, sign a waiver, carry their own required gear, stay with the runner to a designated handoff, and may not mule."
    drop_bag_summary: "On-course bags wait at Highway 89, Tamarack, Cypress, both Base passes, Burney Mountain Summit, Goose Valley, and Black Ranch. All bags are staged at the Guest Ranch Thursday from 4:00-7:00 PM; the Start is a staging location, not an on-course bag pass."
    tracking_note: "No live tracking is published. Results post on UltraSignup; the stable results surface currently shows 2026 and links 2025."
  blurb: A provisional 102-mile operational frame from Burney Mountain Guest Ranch through Hat Creek and the snow-dependent high country, with about 15,000 feet of climb and 40 hours.
  about: >-
    Burney Mountain 100 starts and finishes at Burney Mountain Guest
    Ranch, crossing the Hat Creek country and climbing into the high
    country around Burney Mountain. The current guide lays out eleven
    mid-race passes inside a 40-hour window, with eight cutoff clocks,
    five crew-accessible mid-race passes, and pacers from the first
    Base of Burney Mountain pass at mile 55. Snow decides which of
    four course variants will run in 2027, so the current 102-mile
    operational table and organizer-linked 104-mile line remain
    provisional until race week.
  start_venue: Burney Mountain Guest Ranch, Cassel, CA
  finish_venue: Burney Mountain Guest Ranch, Cassel, CA

