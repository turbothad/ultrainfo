# Burney Mountain 100 — race data imported by Events::Import. The
# 2027 UltraSignup listing establishes the June 18 running and open
# registration. The organizer's current runner guide governs the
# provisional pass table and cutoff ladder; its current Gaia line is
# still titled 2026 and remains provisional until the snow-dependent
# 2027 course variant is selected. Decisions and conflicts are in
# docs/research/burney-mountain-2027-source-audit.md.

race:
  name: Burney Mountain 100
  slug: burney-mountain-100
  year: 2027
  state: CA
  distance_mi: 102 # The guide's operational table ends at 102; the current-linked route measures 104.02-104.04 GPS miles.
  elevation_gain_ft: 15000 # The 2027 listing's approximate climb; the guide says about 14,000 and Gaia reports 11,614 smoothed.
  elevation_loss_ft: 15000 # The organizer page says the Race climbs and descends a cumulative 15,000 feet.
  start_date: 2027-06-18
  end_date: 2027-06-19
  start_time: 4:30 AM
  time_zone: America/Los_Angeles
  cutoff_hours: 40
  official_url: https://www.intermountainendurance.com/burney-mountain-100
  registration_url: https://ultrasignup.com/register.aspx?did=140927
  results_url: https://ultrasignup.com/results_event.aspx?did=128016
  registration_status: open
  lottery: false
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "Burney Mountain 100 starts and finishes at Burney Mountain Guest Ranch in Cassel, California. UltraSignup's 2027 listing establishes Friday June 18 at 4:30 AM, a live paid registration choice, and a June 11 close; the organizer page and current guide establish the 40-hour window to 8:30 PM Saturday. The exact 2027 route is not final: the listing publishes four snow-dependent variants, A-D, and the guide says the selection will not be known until race week. The organizer currently links a Gaia/CalTopo line explicitly titled Burney Mountain 100 2026 and a mixed-vintage guide whose meal section retains a June 20 date from 2026. Those current links provisionally govern the pass sequence, line, and elevation profile at verification status warning. The guide's thirteen operational passes end at nominal mile 102, while the linked line measures 104.02-104.04 miles; both frames are preserved without claiming the route was rescaled by the organizer. A conditional bare-bones Magee operation has no published mile or table row and is excluded until confirmed. The registration page's displaced Directions pin and same-day JSON-LD end date lose to the named Guest Ranch venue, course endpoints, and forty-hour guide ladder."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
        verified_on: "2026-08-14"
      sources:
        verified_on: "2026-08-14"
    sources:
