# Forgotten Florida 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry copies the organizer's CalTopo "Forgotten Florida 100 mile"
# line (point to point, Shane Kelly Park in Oviedo to the Tosohatchee finish);
# station coordinates are the organizer's map markers. Pass miles, cutoffs,
# and crew/drop/pacer flags follow the Runners Handbook's 100-mile aid station
# matrix. Source decisions are documented in
# docs/research/forgotten-florida-2027-source-audit.md.

race:
  name: Forgotten Florida 100
  slug: forgotten-florida-100
  year: 2027
  state: FL
  distance_mi: 100
  elevation_gain_ft: null # No organizer figure; the course is nearly flat (stations at 8-42 ft).
  elevation_loss_ft: null
  start_date: 2027-01-30
  end_date: 2027-01-31
  start_time: 6:30 AM
  time_zone: America/New_York
  cutoff_hours: 34 # 6:30 AM Saturday start → 4:30 PM Sunday finish cutoff.
  official_url: https://www.runbumtours.com/forgotten-florida
  registration_url: https://ultrasignup.com/register.aspx?did=135495
  results_url: https://ultrasignup.com/results_event.aspx?did=135495
  registration_status: open # 2027 listing showed 11 spots for the 100 at verification; closes 2027-01-29.
  lottery: false # Direct first-come UltraSignup registration; no lottery in any reviewed source.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "The handbook's aid station matrix totals 98.85 miles against the billed 100, and that figure includes the mandatory 1-mile St Nicholas shuttle van ride across Highway 50; the organizer's CalTopo line measures 98.3 miles. The handbook is the 2026 edition (updated January 15, 2026): the 2027 site and UltraSignup listing confirm the January 30-31, 2027 date, distances, and open registration, while matrix cutoffs, the 6:30 AM start, and logistics carry over from the prior edition and may change. The organizer publishes no elevation data; spot elevations are USGS 3DEP queries at the organizer's station markers."
