        label: "USGS 3DEP Elevation Point Query Service (spot elevations)"
        url: "https://epqs.nationalmap.gov/v1/json"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. The race is cupless. Full stations stock first-aid, blister, and chafing supplies, but no medical checks or staff are published, so has_medical stays null. All matrix cutoffs are leave-by times and let up as the race progresses. Required gear for the 100: smartphone, the course GPX or CalTopo app with the route, a 300+ lumen headlamp with spares from Joshua Creek onward, and 1.5 L of water capacity. Runners pay a $3 cash WMA entrance fee. Bronson is marked NO CREW on the organizer map; the shuttle pickup is marked crew access on the map but NO in the 100-mile matrix, and the matrix governs."
    overall_cutoff_label: "4:30 PM January 31, 2027"
    overall_cutoff_notes: "34 hours from the 6:30 AM Saturday start, with leave-by cutoffs at most stations from 7:40 AM Saturday (mile 4) through 1:00 PM Sunday (mile 88.85); the St Nicholas shuttle closes at 9:30 PM sharp."
    pacer_rule_summary: "100-mile runners may pick up a pacer from the 50-mile turnaround onward in Tosohatchee. One pacer at a time, swaps allowed at any crew-accessible station, and every pacer must sign the FWC waiver. No pacers for the 50-mile race."
    drop_bag_summary: "Drop bags (max 2.5-gallon clear zip-top bags, labeled) go to Joshua Creek (mile 29.5) and Charlie Lake (miles 67.1, 72.35, and 84.35); bring them to the start line on race morning. Bags return to the finish when stations close — overnight stations not until Sunday afternoon."
  blurb: Point to point through Tosohatchee and four wild Florida preserves on the Florida Trail.
  about: >-
    Forgotten Florida runs point to point from Shane Kelly Park in Oviedo to
    the Tosohatchee Wildlife Management Area finish near Christmas, FL —
    rarely traveled Florida Trail single track through Little Big Econ,
    Charles Bronson State Forest, Seminole Ranch, and Tosohatchee, with palm
    groves, pine flatwoods, dirt roads, a famous mud mile, and a mandatory
    1-mile shuttle across Highway 50. Start 6:30 AM Saturday; 34-hour limit
    (4:30 PM Sunday) with leave-by cutoffs at most stations.
  start_venue: Shane Kelly Park, 1555 County Rd 426, Oviedo, FL
  finish_venue: Tosohatchee Wildlife Management Area, 3364 Taylor Creek Rd, Christmas, FL

