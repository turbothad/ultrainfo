# LOViT 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry and elevations copy the organizer's official 100-mile GPX
# download; pass miles, crew, drop-bag, and restroom flags follow the
# published aid station chart, cutoffs follow the cutoffs page, and safety-
# runner pickups follow the pacing page. Source decisions are documented in
# docs/research/lovit-2027-source-audit.md.

race:
  name: LOViT 100
  slug: lovit-100
  year: 2027
  state: AR
  distance_mi: 100
  elevation_gain_ft: null # No organizer figure; the official GPX sums to ~13,500 ft.
  elevation_loss_ft: null
  start_date: 2027-02-27
  end_date: 2027-02-28
  start_time: 6:00 AM
  time_zone: America/Chicago
  cutoff_hours: 34 # 6:00 AM Saturday start → 4:00 PM Sunday finish (a 20:24-per-mile pace).
  official_url: https://www.runlovit.com/
  registration_url: https://www.runlovit.com/register
  results_url: https://www.runlovit.com/results
  registration_status: open # The 2027 site's Register page is live; swag deadlines run through January 31, 2027.
  lottery: false # Direct registration; no lottery in any reviewed source.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "The Lake Ouachita Vista Trail course starts and finishes at Mountain Harbor Resort's East Cove and runs two out-and-backs — east to the Avery Rec Area turnaround (mile 32.8) and west to the ADA west-end turnaround (79.4). The cutoffs page quotes Avery at 34.5, Hickory Nut Mountain at 66, and ADA at 81 while the aid chart's cumulative column says 32.8, 62.9, and 79.4; the chart governs pass rows. The official GPX (embedded name `LOViT 100M 2025`, the current download) GPS-measures 97.6 miles against the chart's 100 and sums ~13,500 ft of gain; the organizer publishes no gain figure and run100s' 17,000 was not copied. The pacing page's `Charlton (Westbound) 58 miles` approximate mileage corresponds to the chart's mile-55 Charlton pass."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_home
        label: "LOViT official site home"
        url: "https://www.runlovit.com/"
        verified_on: "2026-08-13"
      - &source_details
        label: "Race details page (starts, cutoffs, records)"
        url: "https://www.runlovit.com/race/details"
        verified_on: "2026-08-13"
      - &source_cutoffs
        label: "Cutoffs page"
        url: "https://www.runlovit.com/cutoffs"
        verified_on: "2026-08-13"
      - &source_aid_chart
        label: "Aid stations page and 100 Mile aid station chart"
        url: "https://www.runlovit.com/aid-stations"
        verified_on: "2026-08-13"
      - &source_pacers
        label: "Pacing and safety runners page"
        url: "https://www.runlovit.com/pacers"
        verified_on: "2026-08-13"
      - &source_drop_bags
        label: "Drop bags page"
        url: "https://www.runlovit.com/drop-bags"
        verified_on: "2026-08-13"
      - &source_gpx
        label: "Official 100-mile course GPX download"
        url: "https://www.runlovit.com/s/lovit-100m-2025-jzzs.gpx"
        verified_on: "2026-08-13"
      - &source_caltopo
        label: "Organizer CalTopo course maps"
        url: "https://caltopo.com/m/GB9S"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Aid stations serve standard ultra food with water and Tailwind; potability is never certified and no medical service is published — the chart's two Spillway passes are marked minimal. Drop bags go to the start/finish, Crystal Springs Pavilion, Avery Rec Area, and (100-mile only) Tompkin's Bend, labeled with name, race number, and station. Safety runners (pacers) are picked up only at the six stations on the pacing page; runners 60 and older may have one from the start with prior Race Director permission. Hosted by Mountain Harbor Resort with the start/finish in the East Cove building, new this year."
    overall_cutoff_label: "4:00 PM February 28, 2027"
    overall_cutoff_notes: "34 hours from the 6:00 AM Saturday start. Firm intermediate cutoffs at Avery Rec Area (5:35 PM Saturday), Hickory Nut Mountain Vista inbound (4:30 AM Sunday), and the ADA west end (10:00 AM Sunday); the cutoffs page quotes those stations at miles 34.5, 66, and 81 against the chart's 32.8, 62.9, and 79.4."
    pacer_rule_summary: "Safety runners are allowed one at a time and only from the six listed pickup stations — westbound Brady Mountain Road (39.8), Crystal Springs Pavilion (50.5), westbound Charlton (chart mile 55), westbound Joplin Road Crossing (68.3), the ADA west end (79.4), and eastbound Joplin Road Crossing (90.5). Runners 60 and older may have a safety runner from the start with prior Race Director permission; safety runners sign a waiver and wear a bib."
    drop_bag_summary: "Drop bags go to the start/finish, Crystal Springs Pavilion, Avery Rec Area, and Tompkin's Bend (100-mile only), labeled with name, race number, and aid station; bags return to the finish pavilion on a rolling schedule and unclaimed items are donated the week after the race."
  blurb: Two Ouachita out-and-backs along the Lake Ouachita Vista Trail from Mountain Harbor Resort.
  about: >-
    The LOViT 100 runs the Lake Ouachita Vista Trail from Mountain Harbor
    Resort's East Cove near Mt. Ida, AR — east to the Avery Rec Area
    turnaround and back, then west past Hickory Nut Mountain to the ADA
    turnaround and home — through the Ouachita National Forest above Lake
    Ouachita. Start 6:00 AM Saturday; 34-hour limit (4:00 PM Sunday) with
    firm cutoffs at Avery, Hickory Nut inbound, and the ADA west end, and
    22 manned aid station passes along the way.
  start_venue: East Cove, Mountain Harbor Resort, Mt. Ida, AR
  finish_venue: East Cove, Mountain Harbor Resort, Mt. Ida, AR

