# Warbird 100 — event data (imported by Events::Import via db/seeds.rb).
# The Trail Sick Warbird page hosts the authorities: the aid station details
# PDF (miles, leave-by clocks, drop/crew/pacer flags, coordinates), the race
# info PDF (schedule pattern, rules, menu, gear, cutoff policy, course
# description), the crew and pacer guide PDF, and the official course GPX;
# the 2027 UltraSignup listing carries the current dates and start time.
# Source decisions are documented in
# docs/research/warbird-2027-source-audit.md.

race:
  name: Warbird 100
  slug: warbird-100
  year: 2027
  state: KY
  distance_mi: 102.2 # The aid table's cumulative frame; the race info PDF bills 103 miles, its CalTopo profile says 102.29, and the official GPX GPS-measures 102.19.
  elevation_gain_ft: 15676 # The race info PDF's CalTopo elevation profile: +15676' / -15676' over 102.29 miles.
  elevation_loss_ft: 15676
  start_date: 2027-03-19
  end_date: 2027-03-20
  start_time: 7:00 AM
  time_zone: America/New_York
  cutoff_hours: 35 # "The cutoffs for Warbird 100 are based on maximum finishing time of 35 hours" — 7:00 AM Friday to 6:00 PM Saturday.
  official_url: https://www.trailsick.com/warbird-100
  registration_url: https://ultrasignup.com/register.aspx?did=139346
  results_url: https://ultrasignup.com/register.aspx?did=139346 # The listing page carries the results tab; results_event.aspx redirects to entrants until 2027 results load.
  registration_status: open # The 2027 listing sells all three distances ($325 for the 100, rising after October 30); registration closes March 15, 2027.
  lottery: false # Direct UltraSignup registration.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "One large backcountry loop from the Leslie County RV Park south of Hyden, KY, almost entirely inside the Daniel Boone National Forest along the Redbird Crest Trail. Distance frames disagree: the aid table's cumulative column ends at 102.2 (governs pass miles), the race info PDF's prose bills 103 miles, its CalTopo profile says 102.29, and the official GPX GPS-measures 102.19. The aid table's Sugar Creek row prints 10:30 PM at mile 80.9 between the 7:00 AM Peabody and 12:55 PM SOGOTP rows — an AM/PM misprint recorded as 10:30 AM — and the finish row's longitude prints -8342894 with a missing decimal point. The race info PDF's drop-bag list quotes a second mile frame (32.40/38.70/48.49/52.79/61.11/71.94/81.48/92.56) against the aid table's rows; the table governs. The PDFs on the current page still carry the 2026 schedule dates (Friday March 13, 2026), while the 2027 listing gives Friday March 19 at 7:00 AM and the same 35-hour, 6:00 PM Saturday pattern. Cutoff policy: clocks at crew-accessible stations are non-negotiable check-out deadlines; at remote stations past cutoff, volunteers may encourage moving to the next crewed station."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_page
        label: "Warbird 100 official page on trailsick.com"
        url: "https://www.trailsick.com/warbird-100"
        verified_on: "2026-08-13"
      - &source_ultrasignup
        label: "UltraSignup 2027 registration page (dates, 7:00 AM start, prices)"
        url: "https://ultrasignup.com/register.aspx?did=139346"
        verified_on: "2026-08-13"
      - &source_aid_pdf
        label: "Aid station details PDF (miles, leave-by clocks, drop/crew/pacer flags, coordinates)"
        url: "https://www.trailsick.com/s/Warbird-100-Aid-Station-Details.pdf"
        verified_on: "2026-08-13"
      - &source_raceinfo_pdf
        label: "Race info PDF (schedule pattern, rules, menu, gear, cutoff policy, course description)"
        url: "https://www.trailsick.com/s/Warbird-100-Race-Info-Final.pdf"
        verified_on: "2026-08-13"
      - &source_crew_pdf
        label: "Crew and pacer guide PDF"
        url: "https://www.trailsick.com/s/Warbird-100-Crew-and-Pacer-Guide-Final.pdf"
        verified_on: "2026-08-13"
      - &source_gpx
        label: "Official course GPX download (Warbird 100 Final)"
        url: "https://www.trailsick.com/s/Warbird-100.gpx"
        verified_on: "2026-08-13"
      - &source_caltopo
        label: "Organizer CalTopo course map"
        url: "https://caltopo.com/m/7GMMGDC"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Runners must check in and out of every aid station, follow the marked course (wrong turns must be retraced on foot), and may not store supplies along the trail; dogs and strollers are prohibited and all roads and trails stay open to the public. Mandatory gear: capacity for one liter of water, an emergency space blanket, and a headlamp for the night section (which may wait in a Bowens Creek drop bag); pepper spray is recommended for the Deer Lick drop bag against loose dogs on the five-mile road section before Single Track. Menu basics at every station: water, carb mix, Coke, Sprite, beer, and bourbon with hot foods (quesadillas, potatoes, pancakes, bacon) at key stations — remote stations may lack hot items. The medical policy provides care per each volunteer's certification level (first aid through EMT), with aid captains and the Race Director able to stop a runner on medical grounds. Cell coverage is very limited: none at Bowens Creek or Bear Creek, spotty at Peabody and Sugar Creek, strong at the start/finish. A shoe-changing area follows the river crossing after Bear Creek. The Ultrapacer course plan is published for pacing math."
    overall_cutoff_label: "6:00 PM March 20, 2027"
    overall_cutoff_notes: "35 hours from the 7:00 AM Friday start. Leave-by clocks at every station from Sawdust Pile on: check-out deadlines are non-negotiable at the crew-accessible stations, while at remote stations volunteers may encourage a runner past cutoff to move to the next crewed station rather than extract them. The aid table's Sugar Creek row prints 10:30 PM — an AM/PM misprint between the 7:00 AM and 12:55 PM rows either side, recorded as 10:30 AM."
    pacer_rule_summary: "One pacer at a time, joining as early as Bowens Creek (mile 32.6, a drop-off-only location where a crew member may leave a pacer to wait) with trades or joins at the crew-accessible Bear Creek (48.9), Peabody (71.4), and Sugar Creek (80.9). Pacers must inform an aid captain when joining or leaving, may use station amenities alongside their runner, may not mule, and are recommended to be 18 or older. Runners are not required to stay with their pacer."
    drop_bag_summary: "One drop bag per runner per location at nine stations — Sawdust Pile, Bowens Creek, Oakley Cave, Bear Creek, Deer Lick, Single Track, Peabody, Sugar Creek, and Rattlesnake — no larger than a small backpack, labeled with name, bib number, and station, turned in by 6:15 PM the night before; bags return to the finish through Saturday and must be picked up by noon Sunday."
    tracking_note: "No live tracking is published; results post on UltraSignup."
  blurb: One giant Daniel Boone National Forest loop along the Redbird Crest Trail from the Leslie County RV Park near Hyden.
  about: >-
    The Warbird 100 runs one large backcountry loop through the hollers
    and ridgelines of Leslie and Clay Counties in southeastern Kentucky,
    almost entirely inside the Daniel Boone National Forest along the
    Redbird Crest Trail from the Leslie County RV Park south of Hyden.
    Start 7:00 AM Friday with a 35-hour cutoff (6:00 PM Saturday) and
    leave-by clocks at fifteen stations along the way. Expect creek and
    river crossings, long ridge climbs to a 2,062-foot high point, crew
    access at three highway trailheads, pacers from mile 32.6, and drop
    bags at nine stations deep in one of the most remote corners of the
    state.
  start_venue: Leslie County RV Park, 263639 US-421, Hyden, KY
  finish_venue: Leslie County RV Park, 263639 US-421, Hyden, KY

