# Southern Tour Ultra — event data (imported by Events::Import via db/seeds.rb).
# Course geometry and station coordinates exactly match the organizer-published
# Google My Maps "10 mile course" linked from the official Course page.
# Station-pass miles use the organizer's published per-loop frame (Station 1 at
# mile 5, the event-field station at mile 10 of each loop); the organizer's own
# map measures the loop at 10.2 mi with Station 1 at ~6.1 mi in the direction
# of travel. Source decisions and contradictions are documented in
# docs/research/southern-tour-2027-source-audit.md.

race:
  name: Southern Tour Ultra
  slug: southern-tour-ultra
  year: 2027
  state: NC
  distance_mi: 100
  elevation_gain_ft: null # Organizer says "primarily flat" and publishes no figure.
  elevation_loss_ft: null
  start_date: 2027-01-15
  end_date: 2027-01-16
  start_time: 12:00 PM
  time_zone: America/New_York
  cutoff_hours: 32 # 12:00 PM Friday start → 8:00 PM Saturday final cutoff.
  official_url: https://www.southerntourultra.com
  registration_url: https://runsignup.com/Race/Register/?raceId=36713
  results_url: https://runsignup.com/Race/Results/Overview/36713
  registration_status: open # RunSignup registration open at verification; closes 2027-01-09 11:59 PM ET.
  lottery: false # Direct first-come RunSignup registration; no lottery in any reviewed source.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "The organizer bills the individual course as 10-mile loops (100 miles in 10 loops); the organizer's own course map measures the loop at 10.2 miles with the mid-loop station at ~6.1 miles in the direction of travel. Loop structure is `subject to change based on conditions`. The course map stores no elevations; spot elevations are USGS 3DEP queries at the on-course points nearest each mapped station."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_race_home
        label: "Southern Tour Ultra race site (RunSignup)"
        url: "https://runsignup.com/Race/NC/Wilmington/SouthernTourUltra"
        verified_on: "2026-08-13"
      - &source_individual_events
        label: "Individual Events page (100-mile rules, cutoffs, stations)"
        url: "https://runsignup.com/Race/SouthernTourUltra/Page/IndividualEvents"
        verified_on: "2026-08-13"
      - &source_schedule
        label: "Race weekend schedule page"
        url: "https://runsignup.com/Race/SouthernTourUltra/Page/Schedule"
        verified_on: "2026-08-13"
      - &source_faq
        label: "Frequently Asked Questions page"
        url: "https://runsignup.com/Race/SouthernTourUltra/Page/FrequentlyAskedQuestions"
        verified_on: "2026-08-13"
      - &source_course_page
        label: "Course page"
        url: "https://runsignup.com/Race/SouthernTourUltra/Page/Course"
        verified_on: "2026-08-13"
      - &source_course_map
        label: "Organizer Google My Maps 10-mile course map (KML export)"
        url: "https://www.google.com/maps/d/kml?mid=1TXRiHGQ6AkgURW1N5CQgnLt362qD5ILo&forcekml=1"
        verified_on: "2026-08-13"
      - &source_camping
        label: "Camping, Parking and Rules page"
        url: "https://runsignup.com/Race/SouthernTourUltra/Page/CampingParkingandRules"
        verified_on: "2026-08-13"
      - &source_usgs
        label: "USGS 3DEP Elevation Point Query Service (spot elevations)"
        url: "https://epqs.nationalmap.gov/v1/json"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Water is listed at both stations but no source certifies potability. The 29-hour `on your final lap by 5:00 PM Saturday` rule is published as a soft cutoff; the 32-hour overall limit is firm. The relay and shorter Saturday races share the venue; this record covers the 100-mile individual race (the organizer's `Individual Events` page)."
    overall_cutoff_label: "8:00 PM January 16, 2027"
    overall_cutoff_notes: "The Individual Events page states a 32-hour limit with a 29-hour soft cutoff: the final lap must start by 5:00 PM Saturday with a headlamp and be completed by 8:00 PM Saturday."
    pacer_rule_summary: "Personal pacers may join their runner anywhere on the course after 50 miles or after 11:59 PM Friday, whichever comes first. One pacer at a time, no pacing on bicycles, muling is allowed."
    drop_bag_summary: "No drop-bag service is published. Runners may place personal aid near the camping area by the event-field station, and the main aid station hosts a personal crew area."
  blurb: Ten flat coastal loops along the Atlantic Intracoastal Waterway on private land outside Wilmington, NC.
  about: >-
    The Southern Tour Ultra 100-miler runs 10 laps of a 10-mile loop on private
    property along the Atlantic Intracoastal Waterway at Scott's Hill, just
    outside Wilmington, NC — packed sand paths, single track, and bush-hogged
    routes through coastal woods that the organizer says George Washington's
    Southern Tour once crossed. Start 12:00 PM Friday; 32-hour overall limit
    (8:00 PM Saturday) with a soft cutoff requiring the final lap to start by
    5:00 PM Saturday.
  start_venue: Southern Tour Race Site, Scott's Hill Loop Road, Wilmington, NC
  finish_venue: Southern Tour Race Site, Scott's Hill Loop Road, Wilmington, NC

# Profile from USGS 3DEP spot elevations at the on-course points nearest each
# mapped station, listed at each pass's nominal mile (the My Maps track carries
# no ele) — the same spot-elevation approach as the Bighorn record.
elevation_series:
  - [0, 22]
  - [5, 18]
  - [10, 22]
  - [15, 18]
  - [20, 22]
  - [25, 18]
  - [30, 22]
  - [35, 18]
  - [40, 22]
  - [45, 18]
  - [50, 22]
  - [55, 18]
  - [60, 22]
  - [65, 18]
  - [70, 22]
  - [75, 18]
  - [80, 22]
  - [85, 18]
  - [90, 22]
  - [95, 18]
  - [100, 22]

# Station passes: coordinates from the GPX waypoints (`match` = waypoint-name
# substring; both waypoints come from the organizer's course map placemarks).
# Miles use the organizer's published per-loop frame: Station 1 at mile 5 and
# the event-field station at mile 10 of each loop. The organizer's own map
# measures the loop at 10.2 mi with Station 1 at ~6.1 mi in travel direction.
# Later loops merge (`<<:`) the Loop 1 passes and override what changes.
aid_stations:
  - match: "Start/Finish Aid Station"
    name: "Start — Event Field"
    direction: "Start"
    mile: 0.0
    elev: 22
    crew: true
    water: true
    pacer: false
    drop: null
    food: true
    med: null
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "Main aid station in the event field; hot food is served throughout the race."
    bathroom: "Portable restrooms and handwashing stations are provided at the event field."
    park: "QR-code parking pass required (about 450 cars). Overflow at Poplar Grove, 1.5 miles away, with shuttles Saturday 5:30 am-7:00 pm. 4-wheel drive recommended for field parking; enter via the Scott's Hill Loop gate."
    crew_notes: "Personal crew area at the main aid station. Friday gates open at 10:00 am for 100-mile runners only."
    pacer_notes: "Pacing begins after 50 miles or after 11:59 PM Friday, whichever comes first — not at the start."
    road: null
    source_metadata: &official_station_source
      verification_status: warning
      source_label: "Individual Events page"
      source_url: "https://runsignup.com/Race/SouthernTourUltra/Page/IndividualEvents"
      verified_on: "2026-08-13"
      source_notes: "Verified on is the retrieval date, not the material's effective year. Listed water is not certified potable by any source. Pass miles use the organizer's per-loop frame (Station 1 at mile 5, the event-field station at mile 10); the organizer's course map measures the loop at 10.2 miles with Station 1 at ~6.1 miles in the direction of travel. Spot elevations are USGS 3DEP values at the on-course points nearest each mapped station."
      sources:
        - *source_individual_events
        - *source_faq
        - *source_course_map
        - *source_camping
        - *source_usgs
  - &mid_loop_pass
    match: "Mid-Loop Aid Station"
    name: "Station 1 — Mid-Loop Aid"
    direction: "Loop 1"
    mile: 5.0
    elev: 18
    crew: false
    water: true
    pacer: false
    drop: null
    food: true
    med: null
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "Stocked aid station with volunteers: gels, water, and electrolytes. The FAQ also lists Ramen and fruit."
    bathroom: null
    park: null
    crew_notes: "Crew access is not published for the mid-loop station; every published crew provision (personal crew area, personal aid placement, camping) is at the start/finish event field."
    pacer_notes: "Pacer pickup is guaranteed only from mile 50; a pacer may join anywhere earlier once it is past 11:59 PM Friday. One pacer at a time; no bicycles; muling is allowed."
    road: null
    source_metadata: *official_station_source
  - &event_field_pass
    match: "Start/Finish Aid Station"
    name: "Station 2 — Event Field"
    direction: "Loop 1"
