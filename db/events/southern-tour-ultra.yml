# Station passes: coordinates from the GPX waypoints (`match` = waypoint-name
# substring; both waypoints come from the organizer's course map placemarks).
# Miles use the organizer's published per-loop frame: Station 1 at mile 5 and
# the event-field checkpoint at mile 10 of each loop. The organizer's own map
# measures the loop at 10.2 mi with Station 1 at ~6.1 mi in travel direction.
aid_stations:
  - match: "Start/Finish Checkpoint"
    name: "Start — Event Field"
    direction: "Start"
    mile: 0.0
    elev: 23
    crew: true
    water: true
    pacer: false
    drop: null
    food: true
    med: null
    cutoff: null
    cutoff_clock: null
    cutoff_elapsed_minutes: null
    aid: "Main aid station in the event field; hot food is served throughout the race."
    bathroom: "Portable restrooms and handwashing stations are provided at the event field."
    park: "QR-code parking pass required (about 450 cars). Overflow at Poplar Grove, 1.5 miles away, with shuttles Saturday 5:30 am-7:00 pm. 4-wheel drive recommended for field parking; enter via the Scott's Hill Loop gate."
    crew_notes: "Personal crew area at the main aid station; 100-mile parking-pass holders may enter Friday from 10:00 am."
    pacer_notes: "Pacing begins after 50 miles or after 11:59 PM Friday, whichever comes first — not at the start."
    road: null
    source_metadata: &official_station_source
      verification_status: warning
      source_label: "Individual Events page"
      source_url: "https://runsignup.com/Race/SouthernTourUltra/Page/IndividualEvents"
