# Rocky Raccoon 100 — event data (imported by Events::Import via db/seeds.rb).
# Course geometry copies the organizer's official GPX download (embedded name
# "2021 Rocky Raccoon 100"; its GPS lap measures 21.5 miles against the aid
# chart's governing 20-mile split frame). Pass miles, cutoffs, crew, and
# drop-bag flags follow the published aid station chart. Source decisions are
# documented in docs/research/rocky-raccoon-2027-source-audit.md.

race:
  name: Rocky Raccoon 100
  slug: rocky-raccoon-100
  year: 2027
  state: TX
  distance_mi: 100
  elevation_gain_ft: 6250 # Five times the organizer's ~1,250 ft per full lap.
  elevation_loss_ft: 6250
  start_date: 2027-02-06
  end_date: 2027-02-07
  start_time: 6:00 AM
  time_zone: America/Chicago
  cutoff_hours: 32 # 6:00 AM Saturday mass start → 2:00 PM Sunday course closure.
  official_url: https://www.tejastrails.com/rocky100/
  registration_url: https://runsignup.com/Race?raceId=76532
  results_url: https://runsignup.com/Race/Results/76532
  registration_status: open # Open at verification; the organizer warns both races sell out and go to a wait list.
  lottery: false # Direct first-come RunSignup registration; no lottery in any reviewed source.
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-13"
    source_notes: "The aid station chart's 20-mile split frame (3.8/5.3/5.0/5.9) governs pass miles; the official GPX download's GPS-recorded lap measures 21.5 miles and its embedded name says 2021, so it is used for geometry only. The race page's summary lists a 7:41 AM final-lap cutoff while the chart's mile-80 row says 7:36 AM; the chart governs the pass rows and the conflict is recorded. The chart prints final-lap mid-stations as miles 84/89/94 against its own split arithmetic of 83.8/89.1/94.1, which this record uses. Elevation gain is five times the organizer's ~1,250 ft per-lap figure; the profile uses the official GPX's elevations with the file's junk trailing zero replaced by the start value."
    section_verifications:
      race_facts:
        verified_on: "2026-08-13"
      course:
        verified_on: "2026-08-13"
      station_passes:
        verified_on: "2026-08-13"
      crew_pacers:
        verified_on: "2026-08-13"
      follow:
        verified_on: "2026-08-13"
      sources:
        verified_on: "2026-08-13"
    sources:
      - &source_race_page
        label: "Rocky Raccoon 100 official page (Tejas Trails)"
        url: "https://www.tejastrails.com/rocky100/"
        verified_on: "2026-08-13"
      - &source_aid_chart
        label: "Aid station chart (published spreadsheet PDF)"
        url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRM-Ahyl7-ubj3bVBhmjvFS_RgWKuKYKLu0WkdzarQCFLTfYgBZ_lW5qPDheCmcFzWkTmw5jm7PqBrk/pub?output=pdf"
        verified_on: "2026-08-13"
      - &source_gpx
        label: "Official course GPX download (Google Drive)"
        url: "https://drive.google.com/file/d/1P_JGfJT723SU5x2Q1boWpgR6vLmxbws4/view?usp=sharing"
        verified_on: "2026-08-13"
      - &source_course_map
        label: "Official course map download (Google Drive)"
        url: "https://drive.google.com/file/d/1OcIEOuX_4RVs19C49DULJjNXTaV4MWkI/preview"
        verified_on: "2026-08-13"
      - &source_runsignup
        label: "RunSignup race site (registration and results)"
        url: "https://runsignup.com/Race?raceId=76532"
        verified_on: "2026-08-13"
    notes: "Checked against first-party sources on August 13, 2026. Every station serves full hot and cold aid with crew welcome; potability is never certified and no medical service is published. The race is cupless and littering is a disqualification. Course marking is yellow arrows, orange caution tape, and reflective confidence markers. The 100K shares the course with a modified short first lap. Live timing runs through the organizer's timing partner (EDS)."
    overall_cutoff_label: "2:00 PM February 7, 2027"
    overall_cutoff_notes: "32 hours from the 6:00 AM Saturday mass start (a 19:12-per-mile slowest pace). Rolling final-lap cutoffs: Tyler's mile 80 by 7:36 AM, Gate by 8:48 AM, Nature Center by 10:30 AM, Dam Nation by 12:06 PM, finish by 2:00 PM Sunday. The race page's summary says 7:41 AM for the final-lap start; the chart's 7:36 AM governs this record."
    pacer_rule_summary: "Pacers are allowed after mile 49; runners 60 and older may have a pacer for the entire race. Pacers register through the organizer's pacer form."
    drop_bag_summary: "Separate labeled drop bags for the Gate and Dam Nation stations are due Friday by 7:00 PM and are delivered by the race; Tyler's Last Resort and Nature Center take no deliveries."
  blurb: Five 20-mile laps of piney single track at Huntsville State Park — the classic Texas hundred.
  about: >-
    The Rocky Raccoon 100 runs five 20-mile laps at Huntsville State Park,
    Huntsville, TX — rolling piney single track and jeep road with about
    1,250 ft of gain per lap and full hot-and-cold aid at four stations every
    lap. Mass start 6:00 AM Saturday; 32-hour limit with rolling final-lap
    cutoffs from mile 80 (7:36 AM Sunday) to the 2:00 PM Sunday course
    closure. First run in 1993, it is one of the longest-standing 100-mile
    trail races in the country.
  start_venue: Tyler's Last Resort, Huntsville State Park, 565 Park Road 40 West, Huntsville, TX
  finish_venue: Tyler's Last Resort, Huntsville State Park, 565 Park Road 40 West, Huntsville, TX

