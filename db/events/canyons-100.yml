# Canyons 100M — event data (imported by Events::Import via db/seeds.rb).
# The 2027 100M race page and registration page on canyons.utmb.world carry
# the current dates, noon start, 35-hour cutoff, and open registration; the
# page's linked 100 Mile Aid Station Chart (revision 4/22/26) carries the
# pass table; the page's linked official GPX carries geometry, elevations,
# and station waypoints. Source decisions are documented in
# docs/research/canyons-2027-source-audit.md.

race:
  name: Canyons 100M
  slug: canyons-100
  year: 2027
  state: CA
  distance_mi: 100.3 # The aid chart's cumulative frame; the official GPX GPS-measures 98.60 and the page header says 161 km.
  elevation_gain_ft: 18000 # The course description's "Approximately 18,000 feet of vert"; the overview line says about 17,000, the header 5,550 m, and the chart's cumulative column reaches 18,043.
  elevation_loss_ft: 22000 # The course description's "22,000 of descent"; the chart's cumulative column reaches 21,479.
  start_date: 2027-04-23
  end_date: 2027-04-24
  start_time: 12:00 PM
  time_zone: America/Los_Angeles
  cutoff_hours: 35 # "Max Allowed Race Time 35 Hours" — the chart's finish row closes 11:00 PM Saturday.
  official_url: https://canyons.utmb.world/
  registration_url: https://canyons.utmb.world/runners/registration
  results_url: https://canyons.utmb.world/runners/results
  registration_status: open # "2027 REGISTRATION NOW OPEN" — 100M $498.53 plus fees; closes April 18, 2027.
  lottery: false # Direct registration (Running Stones category 4; a Western States qualifier with Finals Access).
  source_metadata:
    verification_status: warning
    verified_on: "2026-08-14"
    source_notes: "A point-to-point Western States Trail race from the China Wall trailhead to downtown Auburn, CA, finishing across Ann Trason's White Bridge, with the Swinging Bridge turnaround below Devil's Thumb at chart mile 13.5. The 2027 100M page gives Friday, April 23, 2027 at 12:00 with a 35-hour maximum (run100s' 32 is stale); the chart's arrive-by clocks map exactly onto that frame (noon start to the 11:00 PM Saturday finish row). The organizer's gain figures disagree across its own surfaces — the page overview says approximately 17,000 feet, the header says 5,550 m, the course description says approximately 18,000 feet of vert and 22,000 of descent, and the chart's cumulative columns reach 18,043 and 21,479 — the description's rounded pair is recorded. The chart and GPX are the 2026-revision documents linked from the 2027 page (the chart is stamped Revision 4/22/26 and the GPX file is named 2026 ... Course Alternate), and the Crew & Spectators page states the 2026 information stands until roughly six to eight weeks before the 2027 race; the chart notes the course is subject to change under permitting."
    section_verifications:
      race_facts:
        verified_on: "2026-08-14"
      course:
        verified_on: "2026-08-14"
      station_passes:
        verified_on: "2026-08-14"
      crew_pacers:
        verified_on: "2026-08-14"
      follow:
        verified_on: "2026-08-14"
      sources:
        verified_on: "2026-08-14"
    sources:
      - &source_race_page
        label: "Canyons 100M race page (dates, noon start, 35 hours, course description, chart and GPX links)"
        url: "https://canyons.utmb.world/races/100M"
        verified_on: "2026-08-14"
      - &source_registration
        label: "Registration page (2027 registration open, prices, deferrals, inclusions)"
        url: "https://canyons.utmb.world/runners/registration"
        verified_on: "2026-08-14"
      - &source_chart
        label: "100 Mile Aid Station Chart PDF (revision 4/22/26, linked from the race page)"
        url: "https://res.cloudinary.com/utmb-world/image/upload/v1776896940/canyons/2026/Aid%20Station%20Charts/2026_The_Canyons_Endurance_Runs_by_UTMB_100_mile_Aid_Station_Chart_Imperial_8312cc28c5.pdf.pdf"
        verified_on: "2026-08-14"
      - &source_gpx
        label: "Official 100M course GPX download (2026 Course Alternate, linked from the race page)"
        url: "https://res.cloudinary.com/utmb-world/raw/upload/v1776808245/canyons/2026/GPX%20Files/2026_Canyons_Endurance_Runs_by_UTMB_100_mile_Course_Alternate_3b179d0806.gpx"
        verified_on: "2026-08-14"
      - &source_crew_page
        label: "Crew & Spectators page (2026 info stands until 6-8 weeks out)"
        url: "https://canyons.utmb.world/crew"
        verified_on: "2026-08-14"
      - &source_home
        label: "Canyons by UTMB site home"
        url: "https://canyons.utmb.world/"
        verified_on: "2026-08-14"
    notes: "Checked against first-party sources on August 14, 2026. Registration includes aid station access, timing, medical assistance, a collapsible cup, post-race food, and the finisher buckle; entries are non-refundable with a one-time any-reason deferral through March 24, 2027. Online registration closes April 18, 2027, and runners must be 18 for the 100M. The route descends Devil's Thumb to the Swinging Bridge and climbs back out, passes Michigan Bluff, Foresthill, and the Cal Street section, follows the American River past Rucky Chucky, and climbs K2 to Cool before the No Hands Bridge finish stretch into Auburn. The chart's mileage and elevation columns are CalTopo-derived per its own footnote. A UTMB World Series race: finishers earn Running Stones (category 4) and the race is a Western States qualifier with Finals Access."
    overall_cutoff_label: "11:00 PM April 24, 2027"
    overall_cutoff_notes: "35 hours from the Friday 12:00 PM start; the chart's finish row closes downtown Auburn at 11:00 PM Saturday, with arrive-by cutoffs at eight stations from Deadwood (6:30 PM Friday) through ALT (3:30 PM Saturday)."
    pacer_rule_summary: "The chart marks pacer access only at the two Cool passes (chart miles 61.3 and 73.5). The Crew & Spectators page still carries the 2026 details and says the 2027 version arrives six to eight weeks before race weekend."
    drop_bag_summary: "The chart marks drop bags at Foresthill (28.5) and the two Cool passes (61.3 and 73.5)."
    tracking_note: "UTMB Live carries live tracking for UTMB World Series races; results post on the site's results page."
  blurb: Western States country point-to-point from China Wall through the canyons to a downtown Auburn finish.
  about: >-
    The Canyons 100M runs point-to-point from the China Wall trailhead
    through the Western States Trail canyons — down Devil's Thumb to
    the Swinging Bridge and back out, through Michigan Bluff and
    Foresthill, down Cal Street along the American River past Rucky
    Chucky, and up K2 to Cool — to finish across Ann Trason's White
    Bridge in downtown Auburn, CA. Noon start Friday with a 35-hour
    maximum and arrive-by cutoffs at eight stations. Approximately
    18,000 feet of climb and 22,000 of descent. A UTMB World Series
    race and Western States qualifier with Finals Access.
  start_venue: China Wall Trailhead, Foresthill, CA
  finish_venue: Downtown Auburn, CA

